name: Gemini Code Reviewer

on:
  pull_request:
    types: [opened, synchronize]
  workflow_dispatch:

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Kodu Klonla
        uses: actions/checkout@v4

      - name: Python Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Gemini ile Kodu Incele
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python - << 'EOF'
          import os, urllib.request, json

          api_key = os.environ.get("GEMINI_API_KEY")
          if not api_key:
              raise ValueError("GEMINI_API_KEY secret bulunamadi!")

          # 1. API anahtarinin destekledigi aktif modelleri listele
          list_url = f"https://generativelanguage.googleapis.com/v1beta/models?key={api_key}"
          req = urllib.request.Request(list_url)
          
          with urllib.request.urlopen(req) as resp:
              models_data = json.loads(resp.read().decode('utf-8'))

          available_models = [
              m["name"] for m in models_data.get("models", [])
              if "generateContent" in m.get("supportedGenerationMethods", [])
          ]

          print("Kullanilabilir Modeller:", available_models)

          if not available_models:
              raise RuntimeError("Bu API anahtari icin generateContent destekleyen model bulunamadi!")

          # Tercihen flash/pro iceren, yoksa ilk uygun modeli sec
          selected_model = available_models[0]
          for m in available_models:
              if "gemini" in m.lower() and "flash" in m.lower():
                  selected_model = m
                  break

          print(f"Secilen Model: {selected_model}")

          # 2. Secilen model ile icerik uret
          gen_url = f"https://generativelanguage.googleapis.com/v1beta/{selected_model}:generateContent?key={api_key}"
          payload = {
              "contents": [{
                  "parts": [{"text": "Ders programı optimizasyon web uygulamasi icin kod kalitesi, performans ve güvenlik acisindan 3 onemli tavsiye yaz."}]
              }]
          }

          req_gen = urllib.request.Request(
              gen_url,
              data=json.dumps(payload).encode('utf-8'),
              headers={"Content-Type": "application/json"}
          )

          with urllib.request.urlopen(req_gen) as resp:
              res = json.loads(resp.read().decode('utf-8'))
              text = res['candidates'][0]['content']['parts'][0]['text']
              print("\n================ GEMINI RAPORU ================\n")
              print(text)
              print("\n===============================================\n")
          EOF
