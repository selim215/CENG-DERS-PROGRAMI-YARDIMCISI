name: Gemini Code Reviewer

on:
  pull_request:
    types: [opened, synchronize]
  workflow_dispatch:

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Kodu Klonla
        uses: actions/checkout@v4

      - name: Python Ortamı Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Gemini SDK Kur
        run: |
          pip install google-genai

      - name: Gemini ile Kodu Incele
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python - << 'EOF'
          import os
          from google import genai

          client = genai.Client(api_key=os.environ.get("GEMINI_API_KEY"))
          response = client.models.generate_content(
              model="gemini-2.5-flash",
              contents="Ders programı optimizasyon projesinde kod kalitesi, performans ve güvenlik açısından dikkat edilmesi gereken 3 kritik maddeyi kısaca listele."
          )
          print("\n--- GEMINI INCELEME RAPORU ---")
          print(response.text)
          print("-------------------------------\n")
          EOF
