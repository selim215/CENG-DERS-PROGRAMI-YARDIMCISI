name: Gemini Code Reviewer

on:
  pull_request:
    types: [opened, synchronize]
  workflow_dispatch:

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Kodu Klonla
        uses: actions/checkout@v4

      - name: Python Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Gemini ile Kodu Incele
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python - << 'EOF'
          import os, urllib.request, json

          api_key = os.environ.get("GEMINI_API_KEY")
          if not api_key:
              raise ValueError("GEMINI_API_KEY secret bulunamadi!")

          url = f"https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key={api_key}"
          headers = {"Content-Type": "application/json"}
          payload = {
              "contents": [{
                  "parts": [{"text": "Ders programı optimizasyon web aracı için kod kalitesi, performans ve güvenlik açısından dikkat edilmesi gereken 3 kritik maddeyi kısaca yaz."}]
              }]
          }

          req = urllib.request.Request(url, data=json.dumps(payload).encode('utf-8'), headers=headers)
          try:
              with urllib.request.urlopen(req) as response:
                  res_data = json.loads(response.read().decode('utf-8'))
                  text = res_data['candidates'][0]['content']['parts'][0]['text']
                  print("\n================ GEMINI INCELEME RAPORU ================\n")
                  print(text)
                  print("\n========================================================\n")
          except urllib.error.HTTPError as e:
              print("API Hatasi:", e.code, e.read().decode('utf-8'))
              raise e
          EOF
