  <style>
/* ============================================
   DESIGN SYSTEM: DARK & LIGHT THEMES
   ============================================ */
:root, [data-theme="dark"], body.dark {
  --bg-primary: #0a0e1a;
  --bg-secondary: #111827;
  --bg-tertiary: #1a2235;
  --bg-card: rgba(17, 25, 45, 0.75);
  --bg-card-solid: #11192d;
  --bg-glass: rgba(255, 255, 255, 0.03);
  --bg-glass-hover: rgba(255, 255, 255, 0.06);
  --bg-popover: #151d32;

  --border-primary: rgba(255, 255, 255, 0.07);
  --border-secondary: rgba(255, 255, 255, 0.12);
  --border-accent: rgba(99, 102, 241, 0.4);

  --text-primary: #f8fafc;
  --text-secondary: #94a3b8;
  --text-tertiary: #64748b;
  --text-muted: #475569;

  --accent-primary: #6366f1;
  --accent-primary-light: #818cf8;
  --accent-secondary: #8b5cf6;
  --accent-success: #10b981;
  --accent-warning: #f59e0b;
  --accent-danger: #ef4444;
  --accent-info: #06b6d4;

  --gradient-primary: linear-gradient(135deg, #6366f1 0%, #8b5cf6 50%, #a78bfa 100%);
  --gradient-glow: radial-gradient(ellipse at 50% 0%, rgba(99, 102, 241, 0.18) 0%, transparent 60%);
  --gradient-card: linear-gradient(135deg, rgba(99, 102, 241, 0.06) 0%, rgba(139, 92, 246, 0.02) 100%);

  --table-bg: rgba(10, 14, 26, 0.55);
  --table-header-bg: rgba(99, 102, 241, 0.07);
  --input-bg: rgba(0, 0, 0, 0.35);
  --shadow-panel: 0 8px 32px rgba(0, 0, 0, 0.35);
}

[data-theme="light"], body.light {
  --bg-primary: #f8fafc;
  --bg-secondary: #ffffff;
  --bg-tertiary: #f1f5f9;
  --bg-card: rgba(255, 255, 255, 0.94);
  --bg-card-solid: #ffffff;
  --bg-glass: rgba(0, 0, 0, 0.02);
  --bg-glass-hover: rgba(0, 0, 0, 0.05);
  --bg-popover: #ffffff;

  --border-primary: #e2e8f0;
  --border-secondary: #cbd5e1;
  --border-accent: rgba(79, 70, 229, 0.3);

  --text-primary: #0f172a;
  --text-secondary: #475569;
  --text-tertiary: #64748b;
  --text-muted: #94a3b8;

  --accent-primary: #4f46e5;
  --accent-primary-light: #4338ca;
  --accent-secondary: #7c3aed;
  --accent-success: #059669;
  --accent-warning: #d97706;
  --accent-danger: #dc2626;
  --accent-info: #0891b2;

  --gradient-primary: linear-gradient(135deg, #4f46e5 0%, #7c3aed 50%, #9333ea 100%);
  --gradient-glow: radial-gradient(ellipse at 50% 0%, rgba(79, 70, 229, 0.1) 0%, transparent 60%);
  --gradient-card: linear-gradient(135deg, rgba(79, 70, 229, 0.04) 0%, rgba(124, 58, 237, 0.01) 100%);

  --table-bg: #ffffff;
  --table-header-bg: #f8fafc;
  --input-bg: #f8fafc;
  --shadow-panel: 0 4px 20px rgba(0, 0, 0, 0.06);
}

:root {
  --font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  --radius-sm: 6px;
  --radius-md: 10px;
  --radius-lg: 14px;
  --radius-full: 9999px;
  --transition-fast: 150ms cubic-bezier(0.4, 0, 0.2, 1);
  --transition-base: 250ms cubic-bezier(0.4, 0, 0.2, 1);
}

*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
html { font-size: 16px; scroll-behavior: smooth; -webkit-font-smoothing: antialiased; }
body {
  font-family: var(--font-family); background: var(--bg-primary); color: var(--text-primary);
  min-height: 100vh; line-height: 1.6; overflow-x: hidden;
  transition: background-color var(--transition-base), color var(--transition-base);
}
body::before {
  content: ''; position: fixed; top: 0; left: 0; right: 0; height: 500px;
  background: var(--gradient-glow); pointer-events: none; z-index: 0;
  transition: background var(--transition-base);
}
body::after {
  content: '';
  position: fixed;
  top: 0;
  left: 0;
  width: 100vw;
  height: 100vh;
  background-image: url('162286.jpg');
  background-size: cover;
  background-position: center;
  background-attachment: fixed;
  background-repeat: no-repeat;
  opacity: 0.08;
  pointer-events: none;
  z-index: 0;
  transition: opacity var(--transition-base);
}
[data-theme="light"] body::after, body.light::after {
  opacity: 0.05;
}

::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(99, 102, 241, 0.35); border-radius: var(--radius-full); }

.app { max-width: 1580px; margin: 0 auto; padding: 24px; position: relative; z-index: 1; }

/* Header & Theme Toggle */
.header { text-align: center; padding: 32px 20px 20px; }
.header-top-bar {
  display: flex; align-items: center; justify-content: center; gap: 16px; margin-bottom: 12px;
}
.header__badge {
  display: inline-flex; align-items: center; gap: 8px; padding: 5px 16px;
  background: rgba(99, 102, 241, 0.12); border: 1px solid rgba(99, 102, 241, 0.25);
  border-radius: var(--radius-full); font-size: 0.72rem; font-weight: 600;
  color: var(--accent-primary-light); text-transform: uppercase; letter-spacing: 1.5px;
}
.header__badge-dot {
  width: 7px; height: 7px; border-radius: 50%; background: var(--accent-success);
  box-shadow: 0 0 8px var(--accent-success);
  animation: pulse-dot 2s infinite;
}
@keyframes pulse-dot { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.4; transform: scale(0.8); } }

.theme-toggle-btn {
  display: inline-flex; align-items: center; gap: 6px; padding: 5px 14px;
  border-radius: var(--radius-full); border: 1px solid var(--border-secondary);
  background: var(--bg-card); color: var(--text-primary); font-family: var(--font-family);
  font-size: 0.74rem; font-weight: 600; cursor: pointer; transition: all var(--transition-fast);
  user-select: none; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
}
.theme-toggle-btn:hover {
  border-color: var(--accent-primary); background: var(--bg-glass-hover);
  box-shadow: 0 0 12px rgba(99, 102, 241, 0.25); transform: translateY(-1px);
}
.theme-toggle-btn:active { transform: translateY(0); }
.theme-toggle-icon { font-size: 0.95rem; line-height: 1; }

.header__title {
  font-family: 'Playfair Display', Georgia, 'Times New Roman', serif;
  font-size: 2.55rem;
  font-weight: 700;
  letter-spacing: -0.015em;
  background: linear-gradient(135deg, #ffffff 10%, #e0e7ff 50%, #818cf8 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  margin-bottom: 2px;
  line-height: 1.25;
  text-shadow: 0 4px 20px rgba(99, 102, 241, 0.2);
}
[data-theme="light"] .header__title, body.light .header__title {
  background: linear-gradient(135deg, #0f172a 10%, #312e81 50%, #4f46e5 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  text-shadow: none;
}
.header__subtitle { display: none !important; }

/* Layout */
.main-layout { display: grid; grid-template-columns: 360px 1fr; gap: 24px; align-items: start; }
@media (max-width: 1140px) { .main-layout { grid-template-columns: 1fr; } }
.sidebar { display: flex; flex-direction: column; gap: 16px; }

/* Panel */
.panel {
  background: var(--bg-card); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  border: 1px solid var(--border-primary); border-radius: var(--radius-lg); overflow: hidden;
  transition: border-color var(--transition-base), box-shadow var(--transition-base), background var(--transition-base);
  box-shadow: var(--shadow-panel);
}
.panel:hover { border-color: var(--border-secondary); }
.panel__header {
  padding: 14px 20px; border-bottom: 1px solid var(--border-primary);
  display: flex; align-items: center; gap: 12px;
}
.panel__icon {
  width: 32px; height: 32px; border-radius: var(--radius-md); background: var(--gradient-primary);
  display: flex; align-items: center; justify-content: center; font-size: 15px; flex-shrink: 0;
  box-shadow: 0 2px 10px rgba(99, 102, 241, 0.3); color: white;
}
.panel__title { font-size: 0.95rem; font-weight: 700; }
.panel__badge {
  margin-left: auto; font-size: 0.68rem; padding: 2px 8px; border-radius: var(--radius-full);
  background: rgba(99, 102, 241, 0.15); color: var(--accent-primary-light); font-weight: 600;
}
.panel__body { padding: 18px 20px; }

/* Tags */
.course-tags { display: flex; flex-wrap: wrap; gap: 6px; }
.course-tag {
  display: inline-flex; align-items: center; gap: 4px; padding: 4px 10px;
  border-radius: var(--radius-full); font-size: 0.7rem; font-weight: 600; border: 1px solid;
}
.course-tag--loaded { background: rgba(16, 185, 129, 0.12); border-color: rgba(16, 185, 129, 0.3); color: var(--accent-success); }

/* Day Checkboxes */
.constraint-group__label {
  font-size: 0.72rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.8px;
  color: var(--text-tertiary); margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center;
}
.day-checkboxes { display: flex; flex-wrap: wrap; gap: 6px; }
.day-cb { position: relative; }
.day-cb input { position: absolute; opacity: 0; pointer-events: none; }
.day-cb label {
  display: flex; align-items: center; justify-content: center; min-width: 50px;
  padding: 7px 10px; border-radius: var(--radius-md); border: 1px solid var(--border-secondary);
  background: var(--bg-glass); font-size: 0.72rem; font-weight: 600; color: var(--text-secondary);
  cursor: pointer; transition: all var(--transition-fast); user-select: none;
}
.day-cb label:hover { border-color: var(--accent-primary); color: var(--text-primary); }
.day-cb input:checked + label {
  background: rgba(99, 102, 241, 0.18); border-color: var(--accent-primary);
  color: var(--accent-primary-light); box-shadow: 0 0 12px rgba(99, 102, 241, 0.25);
}

/* Friday toggle */
.friday-toggle {
  display: flex; align-items: center; gap: 12px; padding: 10px 14px;
  background: var(--gradient-card); border: 1px solid var(--border-primary); border-radius: var(--radius-md);
  margin-top: 12px;
}
.friday-toggle__label { font-size: 0.78rem; color: var(--text-secondary); flex: 1; font-weight: 500; }
.toggle-switch { position: relative; width: 42px; height: 22px; }
.toggle-switch input { opacity: 0; width: 0; height: 0; }
.toggle-switch__slider {
  position: absolute; cursor: pointer; inset: 0; background: rgba(125, 125, 125, 0.25);
  border-radius: var(--radius-full); transition: var(--transition-base);
}
.toggle-switch__slider::before {
  content: ''; position: absolute; height: 16px; width: 16px; left: 3px; bottom: 3px;
  background: white; border-radius: 50%; transition: var(--transition-base);
}
.toggle-switch input:checked + .toggle-switch__slider { background: var(--accent-primary); }
.toggle-switch input:checked + .toggle-switch__slider::before { transform: translateX(20px); }

/* Instructor Filtering Panel */
.instructor-filters-wrapper {
  max-height: 480px; overflow-y: auto; padding-right: 4px; display: flex; flex-direction: column; gap: 12px;
  overscroll-behavior: contain;
}
.course-filter-card {
  background: var(--bg-glass); border: 1px solid var(--border-primary);
  border-radius: var(--radius-md); padding: 10px 12px; transition: border-color var(--transition-fast);
}
.course-filter-card:hover { border-color: rgba(99, 102, 241, 0.3); }
.course-filter-card__header {
  display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px;
}
.course-filter-card__title {
  font-size: 0.78rem; font-weight: 700; color: var(--accent-primary-light);
  display: flex; align-items: center; gap: 6px;
}
.course-filter-card__sub {
  font-size: 0.65rem; color: var(--text-tertiary); font-weight: normal; margin-left: 4px;
}
.course-filter-card__actions { display: flex; gap: 6px; }
.btn-text-action {
  background: none; border: none; font-size: 0.65rem; color: var(--text-tertiary);
  cursor: pointer; padding: 2px 6px; border-radius: 4px; transition: all var(--transition-fast);
}
.btn-text-action:hover { color: var(--accent-primary-light); background: rgba(99, 102, 241, 0.1); }
.instructor-list { display: flex; flex-direction: column; gap: 5px; }
.instructor-item {
  display: flex; align-items: center; gap: 8px; font-size: 0.73rem;
  color: var(--text-secondary); cursor: pointer; padding: 4px 6px;
  border-radius: var(--radius-sm); transition: background var(--transition-fast);
  user-select: none;
}
.instructor-item:hover { background: var(--bg-glass-hover); color: var(--text-primary); }
.instructor-item input[type="checkbox"] {
  accent-color: var(--accent-primary); width: 14px; height: 14px; cursor: pointer;
}
.instructor-item__name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.instructor-item__sections {
  font-size: 0.62rem; color: var(--text-tertiary); padding: 1px 5px;
  background: var(--bg-glass); border-radius: 4px; font-variant-numeric: tabular-nums;
}

/* Button */
.btn-generate {
  width: 100%; padding: 13px 20px; border: none; border-radius: var(--radius-md);
  background: var(--gradient-primary); color: white; font-family: var(--font-family);
  font-size: 0.92rem; font-weight: 700; cursor: pointer; transition: all var(--transition-base);
  box-shadow: 0 4px 20px rgba(99, 102, 241, 0.35); position: relative; overflow: hidden; letter-spacing: 0.3px;
}
.btn-generate:hover { transform: translateY(-1px); box-shadow: 0 6px 28px rgba(99, 102, 241, 0.5); }
.btn-generate:active { transform: translateY(0); }
.btn-generate:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

/* Stats Grid */
.stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 16px; }
@media (max-width: 768px) { .stats-grid { grid-template-columns: repeat(2, 1fr); } }
.stat-card {
  padding: 10px 12px; border-radius: var(--radius-md); border: 1px solid var(--border-primary);
  background: var(--gradient-card); text-align: center;
}
.stat-card__value { font-size: 1.25rem; font-weight: 800; color: var(--accent-primary-light); }
.stat-card__label { font-size: 0.68rem; color: var(--text-tertiary); margin-top: 2px; }

/* Advanced Pagination Bar */
.pagination-bar {
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  padding: 10px 14px; background: var(--bg-glass);
  border: 1px solid var(--border-primary); border-radius: var(--radius-md); margin-bottom: 16px;
}
.pagination-controls { display: flex; align-items: center; gap: 6px; }
.btn-nav-page {
  min-width: 36px; height: 36px; padding: 0 8px; border-radius: var(--radius-md);
  border: 1px solid var(--border-secondary); background: var(--bg-card);
  color: var(--text-secondary); font-size: 0.78rem; font-weight: 700; cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center; transition: all var(--transition-fast);
  user-select: none;
}
.btn-nav-page:hover:not(:disabled) {
  border-color: var(--accent-primary); color: var(--accent-primary-light);
  background: rgba(99, 102, 241, 0.12); box-shadow: 0 0 12px rgba(99, 102, 241, 0.2);
}
.btn-nav-page:disabled { opacity: 0.25; cursor: not-allowed; }
.page-jump-wrapper {
  display: flex; align-items: center; gap: 6px; font-size: 0.8rem; color: var(--text-secondary); font-weight: 500;
}
.page-input {
  width: 58px; height: 36px; text-align: center; background: var(--input-bg);
  border: 1px solid var(--border-secondary); border-radius: var(--radius-sm);
  color: var(--accent-primary-light); font-weight: 700; font-size: 0.9rem;
  transition: border-color var(--transition-fast); outline: none; font-family: var(--font-family);
}
.page-input:focus { border-color: var(--accent-primary); box-shadow: 0 0 10px rgba(99, 102, 241, 0.3); }
.page-total { color: var(--text-tertiary); font-size: 0.8rem; font-weight: 600; }

/* Export Dropdown */
.export-dropdown-wrapper { position: relative; }
.btn-export-main {
  display: inline-flex; align-items: center; gap: 8px; padding: 8px 16px;
  border-radius: var(--radius-md); border: 1px solid var(--border-accent);
  background: rgba(99, 102, 241, 0.15); color: var(--accent-primary-light);
  font-family: var(--font-family); font-size: 0.78rem; font-weight: 700; cursor: pointer;
  transition: all var(--transition-fast); user-select: none;
}
.btn-export-main:hover {
  background: rgba(99, 102, 241, 0.28); border-color: var(--accent-primary);
  box-shadow: 0 0 16px rgba(99, 102, 241, 0.25);
}
.export-menu {
  position: absolute; right: 0; top: calc(100% + 8px); min-width: 220px;
  background: var(--bg-popover); border: 1px solid var(--border-secondary);
  border-radius: var(--radius-md); box-shadow: 0 12px 36px rgba(0, 0, 0, 0.3);
  padding: 6px; z-index: 100; display: none; flex-direction: column; gap: 2px;
  backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
  animation: fadeIn 0.15s ease-out;
}
.export-menu.show { display: flex; }
.export-item {
  display: flex; align-items: center; gap: 10px; padding: 8px 12px;
  border-radius: var(--radius-sm); color: var(--text-secondary);
  font-size: 0.75rem; font-weight: 600; text-decoration: none; cursor: pointer;
  background: transparent; border: none; width: 100%; text-align: left;
  transition: all var(--transition-fast);
}
.export-item:hover { background: rgba(99, 102, 241, 0.15); color: var(--text-primary); }
.export-item__icon { font-size: 1.1rem; width: 22px; text-align: center; }
.export-item__desc { font-size: 0.65rem; color: var(--text-tertiary); font-weight: normal; margin-left: auto; }

/* Score Bar */
.score-bar { height: 5px; background: rgba(125, 125, 125, 0.15); border-radius: var(--radius-full); overflow: hidden; margin-top: 6px; }
.score-bar__fill { height: 100%; border-radius: var(--radius-full); transition: width 350ms; }
.score-bar__fill--excellent { background: var(--accent-success); box-shadow: 0 0 10px var(--accent-success); }
.score-bar__fill--good { background: var(--accent-success); }
.score-bar__fill--fair { background: var(--accent-warning); }
.score-bar__fill--poor { background: var(--accent-danger); }

/* Schedule Table */
.schedule-container {
  overflow-x: auto; border-radius: var(--radius-md);
  border: 1px solid var(--border-primary); background: var(--table-bg);
}
.schedule-table { width: 100%; border-collapse: separate; border-spacing: 0; min-width: 750px; }
.schedule-table th {
  padding: 12px 10px; font-size: 0.72rem; font-weight: 700; text-transform: uppercase;
  letter-spacing: 1px; color: var(--text-tertiary); background: var(--table-header-bg);
  border-bottom: 1px solid var(--border-primary); position: sticky; top: 0; z-index: 10; text-align: center;
}
.schedule-table th:first-child { text-align: right; padding-right: 14px; width: 85px; }
.schedule-table td {
  padding: 3px; border-bottom: 1px solid var(--border-primary);
  border-right: 1px solid var(--border-primary); height: 42px;
  vertical-align: top; position: relative;
}
.schedule-table td:first-child {
  text-align: right; padding-right: 12px; font-size: 0.68rem; color: var(--text-muted);
  font-weight: 600; font-variant-numeric: tabular-nums; vertical-align: middle; white-space: nowrap;
  border-right: 1px solid var(--border-primary); background: var(--bg-glass);
}

/* Course Block */
.course-block {
  border-radius: var(--radius-sm); padding: 6px 8px; font-size: 0.7rem; line-height: 1.35;
  overflow: hidden; cursor: pointer; transition: all var(--transition-fast);
  border: 1px solid transparent; min-height: 100%; display: flex; flex-direction: column;
  justify-content: flex-start; position: relative;
}
.course-block:hover {
  transform: translateY(-2px) scale(1.015); z-index: 20;
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35), 0 0 16px rgba(99, 102, 241, 0.25);
  border-color: rgba(255, 255, 255, 0.3) !important;
}
.course-block__code { font-weight: 800; font-size: 0.72rem; letter-spacing: 0.4px; display: flex; align-items: center; justify-content: space-between; }
.course-block__section { font-weight: 600; opacity: 0.9; font-size: 0.65rem; margin-top: 1px; }
.course-block__instructor { font-size: 0.62rem; opacity: 0.85; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
.course-block__time { font-size: 0.58rem; opacity: 0.65; font-variant-numeric: tabular-nums; margin-top: auto; }

/* Grouped / Alternative Section Badge */
.course-block__alt-badge {
  display: inline-flex; align-items: center; gap: 3px; font-size: 0.58rem;
  font-weight: 700; padding: 1px 4px; border-radius: 4px;
  background: rgba(245, 158, 11, 0.25); color: #fbbf24; border: 1px solid rgba(245, 158, 11, 0.45);
  margin-top: 3px; letter-spacing: 0.2px; width: fit-content;
  box-shadow: 0 0 8px rgba(245, 158, 11, 0.2);
}

/* Course colors in Dark Mode */
.course-block--0 { background: rgba(99, 102, 241, 0.18); border-color: rgba(99, 102, 241, 0.35); color: #c7d2fe; }
.course-block--1 { background: rgba(139, 92, 246, 0.18); border-color: rgba(139, 92, 246, 0.35); color: #ddd6fe; }
.course-block--2 { background: rgba(6, 182, 212, 0.18); border-color: rgba(6, 182, 212, 0.35); color: #a5f3fc; }
.course-block--3 { background: rgba(16, 185, 129, 0.18); border-color: rgba(16, 185, 129, 0.35); color: #a7f3d0; }
.course-block--4 { background: rgba(245, 158, 11, 0.18); border-color: rgba(245, 158, 11, 0.35); color: #fde68a; }
.course-block--5 { background: rgba(239, 68, 68, 0.18); border-color: rgba(239, 68, 68, 0.35); color: #fecaca; }
.course-block--6 { background: rgba(236, 72, 153, 0.18); border-color: rgba(236, 72, 153, 0.35); color: #fbcfe8; }

/* Course colors in Light Mode */
[data-theme="light"] .course-block--0, body.light .course-block--0 { background: #e0e7ff; border-color: #a5b4fc; color: #312e81; }
[data-theme="light"] .course-block--1, body.light .course-block--1 { background: #ede9fe; border-color: #c4b5fd; color: #4c1d95; }
[data-theme="light"] .course-block--2, body.light .course-block--2 { background: #cffafe; border-color: #67e8f9; color: #164e63; }
[data-theme="light"] .course-block--3, body.light .course-block--3 { background: #d1fae5; border-color: #6ee7b7; color: #064e3b; }
[data-theme="light"] .course-block--4, body.light .course-block--4 { background: #fef3c7; border-color: #fcd34d; color: #78350f; }
[data-theme="light"] .course-block--5, body.light .course-block--5 { background: #fee2e2; border-color: #fca5a5; color: #7f1d1d; }
[data-theme="light"] .course-block--6, body.light .course-block--6 { background: #fce7f3; border-color: #f9a8d4; color: #831843; }

/* Interactive Tooltip / Popover */
.popover-card {
  position: fixed; z-index: 1000; min-width: 280px; max-width: 360px;
  background: var(--bg-popover); border: 1px solid var(--border-secondary);
  border-radius: var(--radius-md); padding: 14px; box-shadow: 0 16px 40px rgba(0, 0, 0, 0.4);
  pointer-events: auto; backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  animation: popoverFadeIn 0.18s cubic-bezier(0, 0, 0.2, 1);
}
@keyframes popoverFadeIn {
  from { opacity: 0; transform: translateY(6px) scale(0.96); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}
.popover-card__header {
  display: flex; align-items: flex-start; justify-content: space-between;
  border-bottom: 1px solid var(--border-primary); padding-bottom: 8px; margin-bottom: 10px;
}
.popover-card__code { font-size: 0.95rem; font-weight: 800; color: var(--accent-primary-light); }
.popover-card__name { font-size: 0.76rem; color: var(--text-secondary); margin-top: 2px; }
.popover-card__close {
  background: none; border: none; color: var(--text-tertiary); font-size: 1.1rem;
  cursor: pointer; line-height: 1; padding: 2px;
}
.popover-card__close:hover { color: var(--text-primary); }
.popover-card__row { display: flex; align-items: center; gap: 8px; font-size: 0.75rem; margin-bottom: 6px; }
.popover-card__icon { width: 18px; text-align: center; color: var(--accent-primary-light); font-size: 0.85rem; }
.popover-card__label { color: var(--text-tertiary); font-size: 0.72rem; min-width: 65px; }
.popover-card__val { color: var(--text-primary); font-weight: 600; }
.popover-card__alt-box {
  margin-top: 10px; padding: 10px; border-radius: var(--radius-sm);
  background: rgba(245, 158, 11, 0.1); border: 1px solid rgba(245, 158, 11, 0.25);
}
.popover-card__alt-title {
  font-size: 0.72rem; font-weight: 700; color: #fbbf24; display: flex; align-items: center; gap: 6px;
  margin-bottom: 6px;
}
.popover-card__alt-item {
  font-size: 0.7rem; color: var(--text-secondary); margin-top: 4px; padding-left: 12px; position: relative;
}
.popover-card__alt-item::before { content: '•'; position: absolute; left: 2px; color: #fbbf24; }

/* Empty State */
.empty-state { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 48px; text-align: center; }
.empty-state__icon { font-size: 3rem; margin-bottom: 16px; opacity: 0.35; }
.empty-state__title { font-size: 1.15rem; font-weight: 700; color: var(--text-secondary); margin-bottom: 8px; }
.empty-state__text { font-size: 0.82rem; color: var(--text-tertiary); max-width: 380px; }

/* Compact label */
.compact-label {
  display: inline-flex; align-items: center; gap: 4px; padding: 3px 9px;
  border-radius: var(--radius-full); font-size: 0.68rem; font-weight: 700;
  text-transform: uppercase; letter-spacing: 0.5px;
}
.compact-label--excellent { background: rgba(16, 185, 129, 0.18); color: var(--accent-success); border: 1px solid rgba(16, 185, 129, 0.3); }
.compact-label--good { background: rgba(16, 185, 129, 0.18); color: var(--accent-success); border: 1px solid rgba(16, 185, 129, 0.3); }
.compact-label--fair { background: rgba(245, 158, 11, 0.18); color: var(--accent-warning); border: 1px solid rgba(245, 158, 11, 0.3); }
.compact-label--poor { background: rgba(239, 68, 68, 0.18); color: var(--accent-danger); border: 1px solid rgba(239, 68, 68, 0.3); }

/* Selection Tags */
.sel-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.sel-tag {
  padding: 3px 9px; border-radius: var(--radius-full); background: var(--bg-glass);
  border: 1px solid var(--border-primary); font-size: 0.68rem; color: var(--text-secondary);
}

@keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
.fade-in { animation: fadeIn 0.25s ease-out forwards; }

/* ============================================
   ENHANCED HEADER (3-BLOCK FLEXBOX LAYOUT)
   ============================================ */
.header-enhanced {
  padding: 16px 24px 20px;
  position: relative;
}
.header-top-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: relative;
  width: 100%;
  gap: 16px;
  padding-bottom: 16px;
  border-bottom: 1px solid var(--border-primary);
  margin-bottom: 20px;
}

/* Sol Alan: 1. Yarıyıl + Mock Dropdown */
.header-left {
  display: flex;
  align-items: center;
  gap: 10px;
  flex: 1 1 0%;
  justify-content: flex-start;
  min-width: 0;
}
.header-semester-badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 6px 14px;
  background: rgba(16, 185, 129, 0.12);
  border: 1px solid rgba(16, 185, 129, 0.3);
  border-radius: var(--radius-full);
  font-size: 0.72rem;
  font-weight: 600;
  color: var(--accent-success);
  letter-spacing: 0.3px;
  white-space: nowrap;
}
.header-dev-dropdown {
  position: relative;
  display: inline-flex;
}
.btn-dev-dropdown {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 6px 12px;
  border-radius: var(--radius-full);
  border: 1px dashed var(--border-secondary);
  background: var(--bg-glass);
  color: var(--text-tertiary);
  font-family: var(--font-family);
  font-size: 0.7rem;
  font-weight: 500;
  cursor: pointer;
  transition: all var(--transition-fast);
  user-select: none;
  white-space: nowrap;
}
.btn-dev-dropdown:hover {
  border-color: var(--accent-warning);
  color: var(--accent-warning);
  background: rgba(245, 158, 11, 0.08);
}

/* Merkez Alan: GAZİ ÜNİVERSİTESİ */
.header-center {
  display: flex;
  align-items: center;
  justify-content: center;
  flex: 0 0 auto;
  pointer-events: auto;
  white-space: nowrap;
  padding: 0 12px;
}
.header-brand {
  display: flex;
  align-items: center;
  gap: 16px;
  user-select: none;
}
.header-gazi-logo {
  width: 68px;
  height: 68px;
  object-fit: contain;
  filter: drop-shadow(0 4px 16px rgba(99, 102, 241, 0.35));
  flex-shrink: 0;
  transition: transform var(--transition-fast);
}
.header-gazi-logo:hover {
  transform: scale(1.04);
}
.header-brand-titles {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  justify-content: center;
  text-align: left;
}
.header-brand-name {
  font-size: 1.38rem;
  font-weight: 800;
  letter-spacing: 0.8px;
  background: var(--gradient-primary);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  text-transform: uppercase;
  line-height: 1.15;
}
.header-brand-dept {
  font-family: 'Playfair Display', Georgia, serif;
  font-size: 0.95rem;
  font-weight: 600;
  font-style: italic;
  letter-spacing: 0.6px;
  color: var(--accent-primary-light);
  line-height: 1.25;
  margin-top: 3px;
}

/* Sağ Alan: Geri Sayım + Tarih + Tema Değiştirme (flex-row, items-center, gap-4/16px) */
.header-right {
  display: flex;
  flex-direction: row;
  align-items: center;
  gap: 16px;
  flex: 1 1 0%;
  justify-content: flex-end;
  min-width: 0;
}

/* Geri Sayım Sayacı: Tek Satırda Ferah Tasarım */
.header-countdown-wrapper {
  display: flex;
  align-items: center;
  gap: 8px;
  background: var(--bg-glass);
  padding: 5px 12px;
  border-radius: var(--radius-full);
  border: 1px solid var(--border-primary);
  white-space: nowrap;
}
.header-countdown-label {
  font-size: 0.65rem;
  color: var(--text-tertiary);
  font-weight: 600;
  letter-spacing: 0.3px;
  display: flex;
  align-items: center;
  gap: 4px;
}
.header-countdown {
  display: inline-flex;
  align-items: center;
  gap: 3px;
}
.countdown-unit {
  display: inline-flex;
  align-items: baseline;
  gap: 1px;
}
.countdown-value {
  font-size: 0.8rem;
  font-weight: 800;
  color: var(--accent-primary-light);
  font-variant-numeric: tabular-nums;
  line-height: 1;
}
.countdown-label-sub {
  font-size: 0.6rem;
  color: var(--text-muted);
  font-weight: 600;
}
.countdown-separator {
  font-size: 0.75rem;
  font-weight: 700;
  color: var(--text-muted);
  margin: 0 1px;
}
.countdown-expired {
  font-size: 0.72rem;
  font-weight: 700;
  color: var(--accent-danger);
  padding: 2px 8px;
  border-radius: var(--radius-full);
  background: rgba(239, 68, 68, 0.12);
}

/* Tarih Rozeti */
.header-date-badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 5px 12px;
  background: var(--bg-glass);
  border: 1px solid var(--border-primary);
  border-radius: var(--radius-full);
  font-size: 0.72rem;
  color: var(--text-secondary);
  font-weight: 600;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}

/* Hero Başlık ve Alt Başlık */
.header-hero {
  text-align: center;
  margin-top: 4px;
}

@media (max-width: 1050px) {
  .header-brand-badge { display: none; }
  .header-countdown-label { display: none; }
  .header-right { gap: 10px; }
}
@media (max-width: 820px) {
  .header-top-bar {
    flex-direction: column;
    gap: 12px;
    align-items: center;
  }
  .header-center {
    position: static;
    transform: none;
    order: -1;
    margin-bottom: 4px;
  }
  .header-left, .header-right {
    justify-content: center;
    flex-wrap: wrap;
    width: 100%;
  }
}

/* ============================================
   TOAST NOTIFICATION
   ============================================ */
.toast-container {
  position: fixed; top: 24px; right: 24px; z-index: 9999; pointer-events: none;
}
.toast {
  pointer-events: auto; display: flex; align-items: center; gap: 10px;
  padding: 12px 20px; border-radius: var(--radius-md);
  background: var(--bg-popover); border: 1px solid var(--border-secondary);
  box-shadow: 0 12px 36px rgba(0, 0, 0, 0.35); backdrop-filter: blur(20px);
  color: var(--text-primary); font-size: 0.82rem; font-weight: 600;
  animation: toastSlideIn 0.3s ease-out forwards;
  min-width: 280px;
}
.toast--warning {
  border-color: rgba(245, 158, 11, 0.4);
  background: linear-gradient(135deg, var(--bg-popover) 0%, rgba(245, 158, 11, 0.06) 100%);
}
.toast__icon { font-size: 1.2rem; flex-shrink: 0; }
.toast__text { flex: 1; }
.toast__close {
  background: none; border: none; color: var(--text-tertiary); font-size: 1rem;
  cursor: pointer; padding: 2px 4px; opacity: 0.7; transition: opacity var(--transition-fast);
}
.toast__close:hover { opacity: 1; }
@keyframes toastSlideIn {
  from { opacity: 0; transform: translateX(40px); }
  to { opacity: 1; transform: translateX(0); }
}
@keyframes toastSlideOut {
  from { opacity: 1; transform: translateX(0); }
  to { opacity: 0; transform: translateX(40px); }
}
.toast--exiting { animation: toastSlideOut 0.25s ease-in forwards; }

/* ============================================
   SMART FILTERS PANEL
   ============================================ */
.smart-filters-list {
  display: flex; flex-direction: column; gap: 8px;
}
.smart-filter-item {
  display: flex; align-items: center; gap: 10px; padding: 9px 12px;
  background: var(--gradient-card); border: 1px solid var(--border-primary);
  border-radius: var(--radius-md); transition: border-color var(--transition-fast);
}
.smart-filter-item:hover { border-color: var(--border-secondary); }
.smart-filter-item__icon { font-size: 1.1rem; flex-shrink: 0; }
.smart-filter-item__info { flex: 1; min-width: 0; }
.smart-filter-item__name {
  font-size: 0.76rem; font-weight: 600; color: var(--text-primary); line-height: 1.3;
  display: flex; align-items: center; flex-wrap: wrap; gap: 4px;
}
.smart-filter-item__tag {
  display: inline-flex; align-items: center;
  font-size: 0.62rem; font-weight: 600; color: var(--accent-warning);
  background: rgba(245, 158, 11, 0.12); border: 1px solid rgba(245, 158, 11, 0.3);
  border-radius: var(--radius-full); padding: 1px 7px;
  letter-spacing: 0.2px; line-height: 1.4;
}
.smart-filter-item__desc {
  font-size: 0.62rem; color: var(--text-tertiary); margin-top: 1px; line-height: 1.3;
}
.smart-filter-item--active {
  border-color: rgba(99, 102, 241, 0.35);
  background: linear-gradient(135deg, rgba(99, 102, 241, 0.08) 0%, rgba(139, 92, 246, 0.04) 100%);
}

/* Global Reset Button */
.global-reset-wrapper {
  margin-bottom: 12px;
}
.btn-global-reset {
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 8px 14px;
  border-radius: var(--radius-md);
  border: 1px dashed rgba(99, 102, 241, 0.38);
  background: var(--bg-card);
  color: var(--text-primary);
  font-family: var(--font-family);
  font-size: 0.76rem;
  font-weight: 600;
  cursor: pointer;
  transition: all var(--transition-fast);
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.12);
  user-select: none;
}
.btn-global-reset:hover {
  border-color: var(--accent-primary);
  border-style: solid;
  background: var(--bg-glass-hover);
  box-shadow: 0 0 14px rgba(99, 102, 241, 0.25);
  transform: translateY(-1px);
}
.btn-global-reset:active {
  transform: translateY(0);
}
.btn-global-reset__left {
  display: inline-flex;
  align-items: center;
  gap: 7px;
}
.btn-global-reset__icon {
  font-size: 0.95rem;
  display: inline-block;
  transition: transform var(--transition-fast);
}
.btn-global-reset:hover .btn-global-reset__icon {
  transform: rotate(-180deg);
}
.btn-global-reset__badge {
  font-size: 0.62rem;
  font-weight: 700;
  padding: 2px 8px;
  border-radius: var(--radius-full);
  background: rgba(99, 102, 241, 0.15);
  border: 1px solid rgba(99, 102, 241, 0.3);
  color: var(--accent-primary-light);
  letter-spacing: 0.3px;
}

/* ============================================
   BOOKMARK BUTTON & SAVED SCHEDULES
   ============================================ */
.btn-bookmark {
  display: inline-flex; align-items: center; gap: 6px; padding: 6px 14px;
  border-radius: var(--radius-md); border: 1px solid var(--border-secondary);
  background: var(--bg-glass); color: var(--text-secondary); font-family: var(--font-family);
  font-size: 0.75rem; font-weight: 600; cursor: pointer; transition: all var(--transition-fast);
  user-select: none;
}
.btn-bookmark:hover {
  border-color: var(--accent-warning); color: var(--accent-warning);
  background: rgba(245, 158, 11, 0.08);
}
.btn-bookmark--saved {
  border-color: rgba(245, 158, 11, 0.5); color: #fbbf24;
  background: rgba(245, 158, 11, 0.12);
}
.btn-bookmark--saved:hover {
  background: rgba(245, 158, 11, 0.18);
}

.saved-panel { margin-top: 20px; }
.saved-panel__header-row {
  display: flex; align-items: center; justify-content: space-between; cursor: pointer;
  padding: 0 4px; user-select: none;
}
.saved-panel__toggle-icon {
  font-size: 0.75rem; color: var(--text-tertiary); transition: transform var(--transition-fast);
}
.saved-panel__toggle-icon--open { transform: rotate(180deg); }
.saved-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px;
  margin-top: 12px; animation: fadeIn 0.2s ease-out;
}
.saved-card {
  padding: 10px 12px; border-radius: var(--radius-md); border: 1px solid var(--border-primary);
  background: var(--gradient-card); cursor: pointer; transition: all var(--transition-fast);
  position: relative;
}
.saved-card:hover {
  border-color: var(--accent-primary); transform: translateY(-1px);
  box-shadow: 0 4px 16px rgba(99, 102, 241, 0.15);
}
.saved-card__title {
  font-size: 0.78rem; font-weight: 700; color: var(--accent-primary-light); margin-bottom: 4px;
}
.saved-card__stats {
  font-size: 0.65rem; color: var(--text-tertiary); display: flex; gap: 8px; flex-wrap: wrap;
}
.saved-card__remove {
  position: absolute; top: 6px; right: 6px; background: none; border: none;
  color: var(--text-muted); font-size: 0.85rem; cursor: pointer; padding: 2px 4px;
  border-radius: 4px; transition: all var(--transition-fast); line-height: 1;
}
.saved-card__remove:hover { color: var(--accent-danger); background: rgba(239, 68, 68, 0.12); }
.saved-empty {
  text-align: center; padding: 20px; color: var(--text-muted); font-size: 0.75rem;
  font-style: italic;
}

/* ============================================
   FOOTER SIGNATURE
   ============================================ */
.footer-signature {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 28px 16px 36px;
  margin-top: 36px;
  border-top: 1px solid var(--border-primary);
  gap: 5px;
}
.footer-signature__brand {
  font-size: 0.98rem;
  font-weight: 800;
  letter-spacing: 1.6px;
  text-transform: uppercase;
  background: var(--gradient-primary);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}
.footer-signature__author {
  font-size: 0.74rem;
  color: var(--text-secondary);
  opacity: 0.5;
  letter-spacing: 0.8px;
  font-weight: 400;
}

/* ============================================
   UPLOAD AREA
   ============================================ */
.upload-area {
  border: 2px dashed var(--border-secondary); border-radius: var(--radius-md);
  padding: 28px 16px; text-align: center; cursor: pointer;
  transition: all var(--transition-fast); position: relative;
}
.upload-area.dragover { border-color: var(--accent-primary); background: rgba(99, 102, 241, 0.08); }
.upload-area__icon { font-size: 2rem; margin-bottom: 8px; opacity: 0.5; }
.upload-area__text { font-size: 0.8rem; color: var(--text-secondary); }
.upload-area input[type="file"] {
  position: absolute; inset: 0; opacity: 0; cursor: pointer;
}

/* ============================================
   SELECTION TAGS & INTERACTIVE TRIGGERS
   ============================================ */
.sel-tags-wrapper {
  margin-top: 16px;
  padding: 12px 14px;
  background: var(--bg-glass);
  border-radius: var(--radius-md);
  border: 1px solid var(--border-primary);
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.sel-tags-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 8px;
}
.sel-tags-header__left {
  display: flex;
  align-items: center;
  gap: 6px;
}
.sel-tags-header__title {
  font-size: 0.76rem;
  color: var(--text-secondary);
  font-weight: 700;
}
.sel-tags-header__hint {
  font-size: 0.68rem;
  color: var(--text-tertiary);
}
.btn-open-section-modal {
  background: rgba(99, 102, 241, 0.12);
  border: 1px solid rgba(99, 102, 241, 0.35);
  color: var(--accent-primary-light);
  padding: 5px 12px;
  border-radius: var(--radius-sm);
  font-size: 0.72rem;
  font-weight: 600;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 5px;
  transition: all var(--transition-fast);
}
.btn-open-section-modal:hover {

const SLOT_LABELS = ['08:30-09:20','09:30-10:20','10:30-11:20','11:30-12:20','12:30-13:20','13:30-14:20','14:30-15:20','15:30-16:20','16:30-17:20','17:30-18:20','18:30-19:20','19:30-20:20'];

function timeToMinutes(t){ const [h,m] = t.split(':').map(Number); return h*60+m; }
function getSlotIndex(t){ return TIME_SLOTS.indexOf(t); }
function getSlotSpan(s,e){ return Math.ceil((timeToMinutes(e) - timeToMinutes(s))/60); }
function doTimesOverlap(a,b){
  if(a.day !== b.day) return false;
  const s1 = timeToMinutes(a.start), e1 = timeToMinutes(a.end);
  const s2 = timeToMinutes(b.start), e2 = timeToMinutes(b.end);
  return !(e1 <= s2 || e2 <= s1);
}
function hasConflict(existing, newSlots){
  for(const e of existing) {
    for(const n of newSlots) {
      if(doTimesOverlap(e, n)) return true;
    }
  }
  return false;
}

function getSlotSignature(slots) {
  return slots.map(s => `${s.day}:${s.start}-${s.end}`).sort().join('|');
}

function buildDecisionUnits(courses, instructorFilters = {}, lockedSections = {}) {
  const units = [];
  for (const c of courses) {
    const allowedInstructors = instructorFilters[c.code] || null;

    if (c.type === 'common') {
      const lockedSec = lockedSections[c.code];
      const sectionMap = {};
      for (const comp of c.components) {
        for (const sec of comp.sections) {
          if (lockedSec !== undefined && sec.section !== lockedSec) continue;
          if (lockedSec === undefined && allowedInstructors && !allowedInstructors.includes(sec.instructor)) continue;
          if (!sectionMap[sec.section]) {
            sectionMap[sec.section] = {
              section: sec.section,
              instructor: sec.instructor || '',
              room: sec.room || '',
              slots: []
            };
          }
          sectionMap[sec.section].slots.push(...sec.slots.map(s => ({
            ...s,
            courseCode: c.code,
            courseName: c.name,
            component: comp.component,
            sectionNum: sec.section,
            instructor: sec.instructor || '',
            room: sec.room || ''
          })));
        }
      }

      const signatureMap = {};
      for (const sec of Object.values(sectionMap)) {
        const sig = getSlotSignature(sec.slots);
        if (!signatureMap[sig]) {
          signatureMap[sig] = { section: sec.section, sections: [sec], slots: sec.slots };
        } else {
          signatureMap[sig].sections.push(sec);
        }
      }

      const options = Object.values(signatureMap).map(grp => {
        const altSections = grp.sections.map(s => ({ section: s.section, instructor: s.instructor, room: s.room }));
        const enhancedSlots = grp.slots.map(sl => ({
          ...sl,
          hasAlternative: grp.sections.length > 1,
          allSections: altSections,
          primarySection: grp.section
        }));
        return { section: grp.section, hasAlternative: grp.sections.length > 1, allSections: altSections, slots: enhancedSlots };
      });

      if (options.length > 0) {
        units.push({ id: c.code, courseCode: c.code, courseName: c.name, type: 'common', options });
      }
    } else {
      for (const comp of c.components) {
        const unitId = `${c.code}_${comp.component}`;
        const lockedSec = lockedSections[unitId];

        const filteredSections = comp.sections.filter(sec => {
          if (lockedSec !== undefined) return sec.section === lockedSec;
          if (allowedInstructors && !allowedInstructors.includes(sec.instructor)) return false;
          return true;
        });

        const signatureMap = {};
        for (const sec of filteredSections) {
          const sig = getSlotSignature(sec.slots);
          if (!signatureMap[sig]) {
            signatureMap[sig] = { section: sec.section, sections: [sec], slots: sec.slots };
          } else {
            signatureMap[sig].sections.push(sec);
          }
        }

        const options = Object.values(signatureMap).map(grp => {
          const altSections = grp.sections.map(s => ({ section: s.section, instructor: s.instructor, room: s.room }));
          const enhancedSlots = grp.slots.map(s => ({
            ...s,
            courseCode: c.code,
            courseName: c.name,
            component: comp.component,
            sectionNum: grp.section,
            instructor: grp.sections[0].instructor || '',
            room: grp.sections[0].room || '',
            hasAlternative: grp.sections.length > 1,
            allSections: altSections,
            primarySection: grp.section
          }));
          return { section: grp.section, hasAlternative: grp.sections.length > 1, allSections: altSections, slots: enhancedSlots };
        });

        if (options.length > 0) {
          units.push({
            id: unitId,
            courseCode: c.code,
            courseName: c.name,
            type: 'departmental',
            component: comp.component,
            options
          });
        }
      }
    }
  }
  return units;
}

function generateSchedules(courses, freeDays = [], instructorFilters = {}, maxResults = 500, lockedSections = {}, previousSelections = []) {
  const units = buildDecisionUnits(courses, instructorFilters, lockedSections);
  const totalExpectedUnits = courses.reduce((acc, c) => acc + (c.type === 'common' ? 1 : c.components.length), 0);
  if (units.length < totalExpectedUnits) return [];

  const results = [];
  function bt(ui, currentSlots, currentSelections) {
    if (results.length >= maxResults) return;
    if (ui === units.length) {
      results.push({
        selections: [...currentSelections],
        slots: [...currentSlots],
        score: calcScore(currentSlots)
      });
      return;
    }
    const u = units[ui];
    for (const opt of u.options) {
      if (freeDays.length > 0 && opt.slots.some(s => freeDays.includes(s.day))) continue;
      if (hasConflict(currentSlots, opt.slots)) continue;

      currentSelections.push({
        unitId: u.id,
        courseCode: u.courseCode,
        courseName: u.courseName,
        component: u.component || 'all',
        section: opt.section,
        hasAlternative: opt.hasAlternative,
        allSections: opt.allSections,
        slots: opt.slots
      });
      currentSlots.push(...opt.slots);

      bt(ui + 1, currentSlots, currentSelections);

      currentSelections.pop();
      currentSlots.splice(currentSlots.length - opt.slots.length, opt.slots.length);
    }
  }

  bt(0, [], []);

  // Sort: prioritize keeping previous selections when possible, then compactness score
  results.sort((a, b) => {
    if (previousSelections && previousSelections.length > 0) {
      let aMatches = 0;
      let bMatches = 0;
      for (const p of previousSelections) {
        if (a.selections.some(s => s.courseCode === p.courseCode && s.component === p.component && s.section === p.section)) {
          aMatches++;
        }
        if (b.selections.some(s => s.courseCode === p.courseCode && s.component === p.component && s.section === p.section)) {
          bMatches++;
        }
      }
      if (bMatches !== aMatches) {
        return bMatches - aMatches;
      }
    }
    return a.score.totalGap - b.score.totalGap;
  });

  return results;
}

function calcScore(slots) {
  const isOnlineSlot = (s) => s.courseCode === 'TAR101' || s.isOnline || s.room === 'UZAKTAN' || s.room === 'ONLINE';
  const ds = {};
  for (const s of slots) { if (!ds[s.day]) ds[s.day] = []; ds[s.day].push(s); }
  let tg = 0, ad = 0, th = 0, mg = 0, maxBlockGap = 0;
  for (const d of DAYS) {
    const sl = ds[d]; if (!sl || !sl.length) continue;
    // Ders yükü hesaplaması tüm ders saatlerini kapsar
    for (const s of sl) th += (timeToMinutes(s.end) - timeToMinutes(s.start)) / 60;

    // Hariç Tutulacak Kural: Asenkron/uzaktan yürütülen TAR101 (veya online etiketli) dersleri gün içi boşluk hesaplamasına kesinlikle dahil edilmesin.
    const f2fSlots = sl.filter(s => !isOnlineSlot(s));
    if (!f2fSlots.length) continue;

    ad++;
    const sorted = [...f2fSlots].sort((a, b) => timeToMinutes(a.start) - timeToMinutes(b.start));
    let dg = 0;
    for (let i = 1; i < sorted.length; i++) {
      const g = timeToMinutes(sorted[i].start) - timeToMinutes(sorted[i-1].end);
      if (g > 0) {
        dg += g;
        // Yüz Yüze Blok İnceleme:
        // <= 20 dk: bitişik bloklar (0 blok ara)
        // 21-85 dk: en fazla 1 ders bloğu boşluk (~50-70 dk)
        // 86-135 dk: 2 ders bloğu boşluk (yaklaşık 2 saat / 100-120 dk)
        // > 135 dk: 2 ders bloğundan fazla (3 blok veya daha uzun)
        let blocks = 0;
        if (g > 20 && g <= 85) blocks = 1;
        else if (g > 85 && g <= 135) blocks = 2;
        else if (g > 135) blocks = 3;
        if (blocks > maxBlockGap) {
          maxBlockGap = blocks;
        }
      }
    }
    tg += dg;
    mg = Math.max(mg, dg);
  }

  // Rozet skorlama mantığı revizyonu:
  // - 2 ders bloğundan fazla (3 blok veya daha uzun) boşluk: "Kötü" (kırmızı ton)
  // - 2 ders bloğu (~100-120 dk) boşluk: "Orta" (sarı ton)
  // - Bitişik veya en fazla 1 ders bloğu boşluk: "İyi" (yeşil ton)
  let badge = 'İyi';
  let badgeClass = 'good';
  if (maxBlockGap > 2) {
    badge = 'Kötü';
    badgeClass = 'poor';
  } else if (maxBlockGap === 2) {
    badge = 'Orta';
    badgeClass = 'fair';
  } else {
    badge = 'İyi';
    badgeClass = 'good';
  }

  return {
    totalGap: tg,
    activeDays: ad,
    totalHours: Math.round(th * 10) / 10,
    maxDailyGap: mg,
    avgGapPerDay: ad > 0 ? Math.round(tg / ad) : 0,
    maxBlockGap,
    compactnessBadge: badge,
    compactnessClass: badgeClass
  };
}

function extractInstructorsByCourse(courses) {
  const map = {};
  for (const c of courses) {
    const instSet = new Set();
    const instSections = {};
    for (const comp of c.components) {
      for (const sec of comp.sections) {
        if (sec.instructor) {
          instSet.add(sec.instructor);
          if (!instSections[sec.instructor]) instSections[sec.instructor] = [];
          const label = `${comp.component === 'lab' ? 'Lab ' : ''}Ş.${sec.section}`;
          if (!instSections[sec.instructor].includes(label)) instSections[sec.instructor].push(label);
        }
      }
    }
    map[c.code] = Array.from(instSet).map(name => ({ name, sections: instSections[name] || [] }));
  }
  return map;
}

const h = React.createElement;

// 1. Theme Toggle
const ThemeToggle = React.memo(function ThemeToggle({ theme, onToggle }) {
  return h('button', {
    type: 'button',
    className: 'theme-toggle-btn',
    title: theme === 'dark' ? 'Açık Temaya Geç' : 'Koyu Temaya Geç',
    onClick: (e) => {
      e.preventDefault();
      e.stopPropagation();
      onToggle();
    }
  },
    h('span', { className: 'theme-toggle-icon' }, theme === 'dark' ? '☀️' : '🌙'),
    h('span', null, theme === 'dark' ? 'Açık Tema' : 'Koyu Tema')
  );
});

// 2. Toast Notification with Hover to Pause
const ToastNotification = React.memo(function ToastNotification({ toast, onDismiss }) {
  const [isHovered, setIsHovered] = useState(false);
  const timerRef = useRef(null);

  useEffect(() => {
    if (!toast || toast.exiting) return;

    if (isHovered) {
      if (timerRef.current) {
        clearTimeout(timerRef.current);
        timerRef.current = null;
      }
      return;
    }

    timerRef.current = setTimeout(() => {
      onDismiss();
    }, 3000);

    return () => {
      if (timerRef.current) {
        clearTimeout(timerRef.current);
        timerRef.current = null;
      }
    };
  }, [toast, isHovered, onDismiss]);

  if (!toast) return null;

  return h('div', {
    className: 'toast-container',
    onMouseEnter: () => setIsHovered(true),
    onMouseLeave: () => setIsHovered(false)
  },
    h('div', { className: `toast toast--${toast.type || 'warning'}${toast.exiting ? ' toast--exiting' : ''}` },
      h('span', { className: 'toast__icon' }, toast.icon || '🚧'),
      h('span', { className: 'toast__text' }, toast.message),
      h('button', {
        type: 'button',
        className: 'toast__close',
        onClick: (e) => { e.preventDefault(); e.stopPropagation(); onDismiss(); }
      }, '×')
    )
  );
});

// 7. Advanced Pagination (<<, <, [X] / Y, >, >>) with Strict Boundary Checks
const AdvancedPagination = React.memo(function AdvancedPagination({
  currentIndex,
  total,
  onIndexChange
}) {
  const [inputValue, setInputValue] = useState(() => (total > 0 ? String(currentIndex + 1) : ''));

  useEffect(() => {
    setInputValue(total > 0 ? String(currentIndex + 1) : '');
  }, [currentIndex, total]);

  const isFirstDisabled = currentIndex <= 0;
  const isLastDisabled = currentIndex >= total - 1;

  const handleFirst = useCallback((e) => {
    e.preventDefault();
    e.stopPropagation();
    if (currentIndex > 0) onIndexChange(0);
  }, [currentIndex, onIndexChange]);

  const handlePrev = useCallback((e) => {
    e.preventDefault();
    e.stopPropagation();
    if (currentIndex > 0) onIndexChange(Math.max(0, currentIndex - 1));
  }, [currentIndex, onIndexChange]);

  const handleNext = useCallback((e) => {
    e.preventDefault();
    e.stopPropagation();
    if (currentIndex < total - 1) onIndexChange(Math.min(total - 1, currentIndex + 1));
  }, [currentIndex, total, onIndexChange]);

  const handleLast = useCallback((e) => {
    e.preventDefault();
    e.stopPropagation();
    if (currentIndex < total - 1) onIndexChange(total - 1);
  }, [currentIndex, total, onIndexChange]);

  const handleInputChange = useCallback((e) => {
    const rawVal = e.target.value;
    const cleanVal = rawVal.replace(/[^0-9]/g, '');

    // Harf veya sembol yazılmaya çalışıldığında state'e hiçbir şekilde işlenmesin
    // Girdi boş bırakıldığında ("") aktif görsel tablo bozulmasın
    if (cleanVal === '') {
      setInputValue('');
      return;
    }

    let num = parseInt(cleanVal, 10);
    if (isNaN(num)) {
      setInputValue('');
      return;
    }

    // Maksimum program sayısını aşan değer girildiğinde otomatik olarak üst sınıra yuvarlansın
    if (total > 0 && num > total) {
      num = total;
    }
    if (num < 1) {
      num = 1;
    }

    setInputValue(String(num));
    onIndexChange(num - 1);
  }, [total, onIndexChange]);

  const handleInputBlur = useCallback(() => {
    if (inputValue.trim() === '') {
      setInputValue(total > 0 ? String(currentIndex + 1) : '');
      return;
    }
    let num = parseInt(inputValue, 10);
    if (isNaN(num) || num < 1) {
      num = 1;
    } else if (total > 0 && num > total) {
      num = total;
    }
    setInputValue(String(num));
    onIndexChange(num - 1);
  }, [inputValue, currentIndex, total, onIndexChange]);

  const handleKeyDown = useCallback((e) => {
    if (e.key === 'Enter') {
      e.preventDefault();
      if (inputValue.trim() === '') {
        setInputValue(total > 0 ? String(currentIndex + 1) : '');
        return;
      }
      let num = parseInt(inputValue, 10);
      if (isNaN(num) || num < 1) {
        num = 1;
      } else if (total > 0 && num > total) {
        num = total;
      }
      setInputValue(String(num));
      onIndexChange(num - 1);
    }
  }, [inputValue, total, currentIndex, onIndexChange]);

  return h('div', { className: 'pagination-bar' },
    h('div', { className: 'pagination-controls' },
      h('button', {
        type: 'button',
        className: 'btn-nav-page',
        disabled: isFirstDisabled,
        onClick: handleFirst,
        title: 'En Başa Git (İlk Program)'
      }, '<<'),
      h('button', {
        type: 'button',
        className: 'btn-nav-page',
        disabled: isFirstDisabled,
        onClick: handlePrev,
        title: 'Önceki Program (Sol Ok)'
      }, '◀')
    ),
    h('div', { className: 'page-jump-wrapper' },
      h('span', null, 'Program'),
      h('input', {
        type: 'text',
        inputMode: 'numeric',
        className: 'page-input',
        value: inputValue,
        onChange: handleInputChange,
        onBlur: handleInputBlur,
        onKeyDown: handleKeyDown,
        title: 'İstediğiniz program numarasını yazın'
      }),
      h('span', { className: 'page-total' }, `/ ${total}`)
    ),
    h('div', { className: 'pagination-controls' },
      h('button', {
        type: 'button',
        className: 'btn-nav-page',
        disabled: isLastDisabled,
        onClick: handleNext,
        title: 'Sonraki Program (Sağ Ok)'
      }, '▶'),
      h('button', {
        type: 'button',
        className: 'btn-nav-page',
        disabled: isLastDisabled,
        onClick: handleLast,
        title: 'En Sona Git (Son Program)'
      }, '>>')
    )
  );
});

// 8. Schedule Table Component
const ScheduleTable = React.memo(function ScheduleTable({ schedule, allCourseCodes, onBlockClick, onOpenSectionModal }) {
  const { blocks, occCells, activeDays, minS, maxS } = useMemo(() => {
    const slots = schedule.slots;
    const bList = [];
    const occ = {};

    for (const slot of slots) {
      const si = getSlotIndex(slot.start);
      const span = getSlotSpan(slot.start, slot.end);
      if (si === -1) continue;
      bList.push({
        ...slot,
        startIdx: si,
        span,
        colorIdx: allCourseCodes.indexOf(slot.courseCode) % 7
      });
      for (let i = 0; i < span; i++) occ[`${slot.day}-${si + i}`] = true;
    }

    const aDays = DAYS.filter(d => slots.some(s => s.day === d));
    let mi = 11, ma = 0;
    bList.forEach(b => {
      mi = Math.min(mi, b.startIdx);
      ma = Math.max(ma, b.startIdx + b.span - 1);
    });
    if (mi > ma) { mi = 0; ma = 8; }
    return { blocks: bList, occCells: occ, activeDays: aDays, minS: mi, maxS: ma };
  }, [schedule, allCourseCodes]);

  return h('div', { className: 'schedule-container', id: 'schedule-capture-area' },
    h('table', { className: 'schedule-table' },
      h('thead', null,
        h('tr', null,
          h('th', null, 'Saat'),
          activeDays.map(d => h('th', { key: d }, d))
        )
      ),
      h('tbody', null,
        Array.from({ length: maxS - minS + 1 }, (_, i) => minS + i).map(si =>
          h('tr', { key: si },
            h('td', null, SLOT_LABELS[si]),
            activeDays.map(day => {
              const block = blocks.find(b => b.day === day && b.startIdx === si);
              if (block) {
                return h('td', { key: day, rowSpan: block.span },
                  h('div', {
                    className: `course-block course-block--${block.colorIdx}`,
                    onClick: (e) => {
                      e.preventDefault();
                      e.stopPropagation();
                      const rect = e.currentTarget.getBoundingClientRect();
                      onBlockClick(block, rect);
                    }
                  },
                    h('div', { className: 'course-block__code' },
                      h('span', null, block.courseCode),
                      block.room ? h('span', { style: { fontSize: '0.62rem', opacity: 0.8 } }, block.room) : null
                    ),
                    h('div', { className: 'course-block__section' },
                      `${block.component === 'lab' ? 'Lab' : 'Teori'} · Ş.${block.sectionNum}`
                    ),
                    block.instructor ? h('div', { className: 'course-block__instructor', title: block.instructor },
                      `👨‍🏫 ${block.instructor}`
                    ) : null,
                    block.hasAlternative && block.allSections && block.allSections.length > 1 ? (
                      h('div', {
                        className: 'course-block__alt-badge',
                        title: 'Alternatif şubeleri görüntüle ve manuel değiştir',
                        onClick: (e) => {
                          e.preventDefault();
                          e.stopPropagation();
                          if (onOpenSectionModal) {

                    ) : null,
                    h('div', { className: 'course-block__time' }, `${block.start}–${block.end}`)
                  )
                );
              } else if (!occCells[`${day}-${si}`]) {
                return h('td', { key: day });
              }
              return null;
            })
          )
        )
      )
    )
  );
});

// Helper for Turkish NLP text normalization
function normalizeTurkish(s) {
  if (!s) return '';
  return s
    .toLocaleLowerCase('tr-TR')
    .replace(/ı/g, 'i')
    .replace(/ğ/g, 'g')
    .replace(/ü/g, 'u')
    .replace(/ş/g, 's')
    .replace(/ö/g, 'o')
    .replace(/ç/g, 'c')
    .replace(/[^a-z0-9\s]/g, ' ')
    .replace(/\s+/g, ' ')
    .trim();
}

// 11. Section Select Modal (Manuel Şube Seçimi & Kontenjan Yönetimi)
const SectionSelectModal = React.memo(function SectionSelectModal({
  isOpen,
  modalData,
  courseData,
  currentSchedule,
  onClose,
  onApplySection
}) {
  if (!isOpen || !currentSchedule) return null;

  const courses = courseData ? courseData.courses : DEFAULT_DATA.courses;
  const initialCourse = modalData?.courseCode || courses[0]?.code;
  const [activeCourseCode, setActiveCourseCode] = useState(initialCourse);
  const [confirmModalData, setConfirmModalData] = useState(null);

  useEffect(() => {
    if (modalData?.courseCode) {
      setActiveCourseCode(modalData.courseCode);
    }
    setConfirmModalData(null);
  }, [modalData]);

  const selectedCourse = courses.find(c => c.code === activeCourseCode) || courses[0];
  const isDept = selectedCourse.type === 'departmental';
  const availableComps = isDept ? selectedCourse.components.map(c => c.component) : ['all'];
  const [activeComp, setActiveComp] = useState(() => modalData?.component || availableComps[0] || 'all');

  useEffect(() => {
    if (modalData?.component && availableComps.includes(modalData.component)) {
      setActiveComp(modalData.component);
    } else {
      setActiveComp(availableComps[0] || 'all');
    }
    setConfirmModalData(null);
  }, [activeCourseCode]);

  const sections = useMemo(() => {
    if (!selectedCourse) return [];
    if (isDept) {
      const compObj = selectedCourse.components.find(c => c.component === activeComp);
      return compObj ? compObj.sections : [];
    } else {
      return selectedCourse.components[0]?.sections || [];
    }
  }, [selectedCourse, isDept, activeComp]);

  const activeSelection = useMemo(() => {
    if (!currentSchedule || !currentSchedule.selections) return null;
    return currentSchedule.selections.find(s =>
      s.courseCode === activeCourseCode && (activeComp === 'all' || s.component === activeComp)
    );
  }, [currentSchedule, activeCourseCode, activeComp]);

  const checkSectionConflict = useCallback((sec) => {
    const isCurrent = activeSelection && activeSelection.section === sec.section;
    const otherSlots = currentSchedule.slots.filter(s =>
      !(s.courseCode === activeCourseCode && (activeComp === 'all' || s.component === activeComp))
    );
    const conflicts = otherSlots.filter(os =>
      sec.slots.some(ss => doTimesOverlap(os, ss))
    );
    const conflictingCourseNames = Array.from(
      new Set(conflicts.map(c => `${c.courseCode} (${c.courseName})`))
    ).join(', ');

    return {
      isCurrent,
      hasConflict: conflicts.length > 0,
      conflicts,
      conflictingCourseNames
    };
  }, [activeSelection, currentSchedule, activeCourseCode, activeComp]);

  return h('div', {
    className: 'modal-backdrop',
    onClick: onClose
  },
    h('div', {
      className: 'modal-dialog',
      onClick: (e) => e.stopPropagation()
    },
      // Header
      h('div', { className: 'modal-header' },
        h('div', { className: 'modal-header__title-group' },
          h('div', { className: 'modal-header__title' },
            h('span', null, '⚡'),
            'Manuel Şube Seçimi & Kontenjan Yönetimi'
          ),
          h('div', { className: 'modal-header__subtitle' },
            `${selectedCourse.code} — ${selectedCourse.name} ${activeComp !== 'all' ? (activeComp === 'lab' ? '· Laboratuvar' : '· Teori') : ''}`
          )
        ),
        h('button', {
          type: 'button',
          className: 'modal-close-btn',
          onClick: onClose
        }, '×')
      ),

      // Course Navigation Tabs
      h('div', { className: 'modal-course-tabs' },
        courses.map(c =>
          h('button', {
            key: c.code,
            type: 'button',
            className: `modal-course-tab${c.code === activeCourseCode ? ' modal-course-tab--active' : ''}`,
            onClick: () => {
              setActiveCourseCode(c.code);
              setConfirmModalData(null);
            }
          }, c.code)
        )
      ),

      // Component Sub-Tabs if departmental
      isDept && availableComps.length > 1 ? (
        h('div', { className: 'modal-comp-tabs' },
          availableComps.map(comp =>
            h('button', {
              key: comp,
              type: 'button',
              className: `modal-comp-tab${comp === activeComp ? ' modal-comp-tab--active' : ''}`,
              onClick: () => {
                setActiveComp(comp);
                setConfirmModalData(null);
              }
            }, comp === 'lab' ? '🧪 Laboratuvar Şubeleri' : '📖 Teori Şubeleri')
          )
        )
      ) : null,

      // Body & Section List
      h('div', { className: 'modal-body' },
        // Section Cards
        sections.map(sec => {
          const { isCurrent, hasConflict, conflictingCourseNames } = checkSectionConflict(sec);
          return h('div', {
            key: sec.section,
            className: `section-card${isCurrent ? ' section-card--current' : ''}${hasConflict && !isCurrent ? ' section-card--conflict' : ''}`
          },
            h('div', { className: 'section-card__info' },
              h('div', { className: 'section-card__top' },
                h('span', { className: 'section-card__num' }, `Şube ${sec.section}`),
                isCurrent ? (
                  h('span', { className: 'section-badge section-badge--current' }, '✓ Aktif Şube')
                ) : hasConflict ? (
                  h('span', { className: 'section-badge section-badge--conflict' }, `⚠️ ${conflictingCourseNames} ile Çakışıyor`)
                ) : (
                  h('span', { className: 'section-badge section-badge--available' }, '✓ Çakışmasız (Uygun)')
                )
              ),
              h('div', { className: 'section-card__meta' },
                h('span', null, `👨‍🏫 ${sec.instructor || 'Öğretim Üyesi Belirtilmedi'}`),
                sec.room ? h('span', null, `📍 Derslik ${sec.room}`) : null
              ),
              h('div', { className: 'section-card__slots' },
                '⏰ ',
                sec.slots.map(s => `${s.day} ${s.start}–${s.end}`).join(', ')
              )
            ),
            h('div', null,
              isCurrent ? (
                h('button', {
                  type: 'button',
                  className: 'btn-select-section btn-select-section--current',
                  disabled: true
                }, '✓ Seçili')
              ) : (
                h('button', {
                  type: 'button',
                  className: `btn-select-section${hasConflict ? ' btn-select-section--conflict' : ''}`,
                  onClick: () => {
                    if (hasConflict) {
                      setConfirmModalData({
                        courseCode: activeCourseCode,
                        component: activeComp,
                        section: sec,
                        conflictingCourseNames
                      });
                    } else {
                      onApplySection(activeCourseCode, activeComp, sec, false);
                      onClose();
                    }
                  }
                }, hasConflict ? 'Çakışıyor' : 'Bu Şubeyi Seç')
              )
            )
          );
        })
      )
    ),

    // Second Confirmation Modal (Çakışma Onayı)
    confirmModalData ? (
      h('div', {
        className: 'confirm-modal-backdrop',
        onClick: (e) => {
          e.stopPropagation();
          setConfirmModalData(null);
        }
      },
        h('div', {
          className: 'confirm-modal-dialog',
          onClick: (e) => e.stopPropagation()
        },
          h('div', { className: 'confirm-modal-header' },
            h('div', { className: 'confirm-modal-icon' }, '⚠️'),
            h('div', null,
              h('div', { className: 'confirm-modal-title' }, 'Yine de seçmek istiyor musunuz?'),
              h('div', { className: 'confirm-modal-desc', style: { marginTop: '4px' } },
                'Bu seçim diğer derslerin şube seçimlerini değiştirebilir.'
              )
            )
          ),
          h('div', { className: 'confirm-modal-info-box' },
            h('strong', null, `${confirmModalData.courseCode} Şube ${confirmModalData.section.section} kilitlenecektir.`),
            h('span', null, `Çakışan dersler serbest bırakılarak sıfır çakışmalı yeni bir program listesi hesaplanacaktır. (${confirmModalData.conflictingCourseNames})`)
          ),
          h('div', { className: 'confirm-modal-actions' },
            h('button', {
              type: 'button',
              className: 'btn-confirm-cancel',
              onClick: (e) => {
                e.preventDefault();
                e.stopPropagation();
                setConfirmModalData(null);
              }
            }, 'Vazgeç'),
            h('button', {
              type: 'button',
              className: 'btn-confirm-proceed',
              onClick: (e) => {
                e.preventDefault();
                e.stopPropagation();
                const target = confirmModalData;
                setConfirmModalData(null);
                onClose();
                onApplySection(target.courseCode, target.component, target.section, true);
              }
            }, 'Yine de Değiştir')
          )
        )
      )
    ) : null
  );
});

// 12. Chatbot Widget (Uygulama İçi Doğal Dil Asistanı)
const ChatbotWidget = React.memo(function ChatbotWidget({
  isOpen,
  onToggle,
  onExecuteCommand
}) {
  const [messages, setMessages] = useState(() => [
    {
      id: 'welcome',
      sender: 'bot',
      text: 'Merhaba! Ben Ders Programı Asistanınız 🤖.\n\nHoca tercihlerinizi ("Esra Hoca", "Feyza Yıldırım"), saat isteklerinizi ("sabah olmasın", "öğleden sonra", "10\'dan sonra") veya şube atamalarınızı ("BM101 Şube 2 olsun") bana yazabilirsiniz!',
      time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
    }
  ]);
  const [inputValue, setInputValue] = useState('');
  const [isProcessing, setIsProcessing] = useState(false);
  const messagesEndRef = useRef(null);
  const suggestionsRef = useRef(null);

  useEffect(() => {
    if (isOpen) {
      messagesEndRef.current?.scrollIntoView({ behavior: 'smooth' });
    }
  }, [messages, isOpen]);

  useEffect(() => {
    const el = suggestionsRef.current;
    if (!el || !isOpen) return;

    const onWheel = (e) => {
      if (e.deltaY !== 0 || e.deltaX !== 0) {
        e.preventDefault();
        const delta = Math.abs(e.deltaY) > Math.abs(e.deltaX) ? e.deltaY : e.deltaX;
        el.scrollLeft += delta;
      }
    };

    el.addEventListener('wheel', onWheel, { passive: false });
    return () => el.removeEventListener('wheel', onWheel);
  }, [isOpen]);

  const handleSendMessage = useCallback((textToSend) => {
    const text = (textToSend || inputValue || '').trim();
    if (!text || isProcessing) return;

    const userMsg = {
      id: `user-${Date.now()}`,
      sender: 'user',
      text,
      time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
    };

    setMessages(prev => [...prev, userMsg]);
    setInputValue('');
    setIsProcessing(true);

    setTimeout(() => {
      const result = onExecuteCommand(text);
      const botMsg = {
        id: `bot-${Date.now()}`,
        sender: 'bot',
        text: result.message,
        time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
      };
      setMessages(prev => [...prev, botMsg]);
      setIsProcessing(false);
    }, 150);
  }, [inputValue, isProcessing, onExecuteCommand]);

  const handleKeyDown = (e) => {
    if (e.key === 'Enter') {
      e.preventDefault();
      handleSendMessage();
    }
  };

  const handleClearChat = useCallback(() => {
    setMessages([
      {
        id: `welcome-${Date.now()}`,
        sender: 'bot',
        text: 'Sohbet temizlendi. Size nasıl yardımcı olabilirim?',
        time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
      }
    ]);
  }, []);

  const quickSuggestions = [
    'Esra Hoca ve sabah olmasın',
    'Feyza Yıldırım seç',
    'BM101 Şube 2 olsun',
    'Cuma boş olsun',
    'Öğle molası ver',
    'Tüm filtreleri sıfırla'
  ];

  return h('div', { className: 'chat-fab-container' },
    // Floating Action Button
    h('button', {
      type: 'button',
      className: 'chat-fab-btn',
      onClick: onToggle,
      title: isOpen ? 'Asistanı Kapat' : 'Ders Programı Asistanı',
      'aria-label': 'Chatbot Asistanı'
    },
      h('div', { className: 'chat-fab-pulse' }),
      isOpen ? '✕' : '💬'
    ),

    // Chat Window
    isOpen ? (
      h('div', { className: 'chat-window', onClick: (e) => e.stopPropagation() },
        // Header
        h('div', { className: 'chat-header' },
          h('div', { className: 'chat-header__info' },
            h('div', { className: 'chat-header__avatar' }, '🤖'),
            h('div', null,
              h('div', { className: 'chat-header__title' }, 'Program Asistanı'),
              h('div', { className: 'chat-header__status' },
                h('span', { className: 'chat-header__status-dot' }),
                'Çevrimiçi · Doğal Dil ile Filtrele'
              )
            )
          ),
          h('div', { className: 'chat-header__actions' },
            h('button', {
              type: 'button',
              className: 'chat-header__btn',
              title: 'Sohbeti Temizle',
              onClick: handleClearChat
            }, '🗑️'),
            h('button', {
              type: 'button',
              className: 'chat-header__btn',
              title: 'Kapat',
              onClick: onToggle
            }, '✕')
          )
        ),

        // Quick Suggestions
        h('div', { className: 'chat-suggestions', ref: suggestionsRef },
          quickSuggestions.map((sug, idx) =>
            h('button', {
              key: idx,
              type: 'button',
              className: 'chat-chip',
              onClick: () => handleSendMessage(sug)
            }, `💬 ${sug}`)
          )
        ),

        // Messages List
        h('div', { className: 'chat-messages' },
          messages.map(msg =>
            h('div', {
              key: msg.id,
              className: `chat-message chat-message--${msg.sender}`
            },
              h('div', { className: 'chat-bubble' }, msg.text),
              h('span', { className: 'chat-time' }, msg.time)
            )
          ),
          h('div', { ref: messagesEndRef })
        ),

        // Input Area
        h('div', { className: 'chat-input-area' },
          h('input', {
            type: 'text',
            className: 'chat-input',
            placeholder: 'Örn: Esra Hoca olsun ve sabah olmasın...',
            value: inputValue,
            onChange: (e) => setInputValue(e.target.value),
            onKeyDown: handleKeyDown
          }),
          h('button', {
            type: 'button',
            className: 'chat-send-btn',
            disabled: !inputValue.trim() || isProcessing,
            onClick: () => handleSendMessage()
          }, '➤')
        )
      )
    ) : null
  );
});
