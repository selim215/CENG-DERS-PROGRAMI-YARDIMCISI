function App() {
  // Theme state with localStorage persistence
  const [theme, setTheme] = useState(() => {
    return localStorage.getItem('ders_programi_theme') || 'dark';
  });

  useEffect(() => {
    document.documentElement.setAttribute('data-theme', theme);
    if (theme === 'light') {
      document.body.classList.add('light');
      document.body.classList.remove('dark');
    } else {
      document.body.classList.add('dark');
      document.body.classList.remove('light');
    }
    localStorage.setItem('ders_programi_theme', theme);
  }, [theme]);

  const handleToggleTheme = useCallback(() => {
    setTheme(prev => (prev === 'dark' ? 'light' : 'dark'));
  }, []);

  // Course & Schedule State
  const [courseData, setCourseData] = useState(() => DEFAULT_DATA);
  const [freeDays, setFreeDays] = useState(['Cuma']);
  const [instructorFilters, setInstructorFilters] = useState(() => {
    const map = extractInstructorsByCourse(DEFAULT_DATA.courses);
    const filters = {};
    for (const [code, insts] of Object.entries(map)) {
      filters[code] = insts.map(i => i.name);
    }
    return filters;
  });

  const [currentIndex, setCurrentIndex] = useState(0);
  const pendingTargetScheduleRef = useRef(null);
  const [activePopover, setActivePopover] = useState(null);
  const [isExportMenuOpen, setIsExportMenuOpen] = useState(false);

  // ── FAZ 2: New State ──
  const [lunchBreakFilter, setLunchBreakFilter] = useState(false);
  const [sleepyFilter, setSleepyFilter] = useState(false);
  const [historyNoGapFilter, setHistoryNoGapFilter] = useState(false);
  const [toastData, setToastData] = useState(null);
  const [savedSchedules, setSavedSchedules] = useState(() => {
    try {
      return JSON.parse(localStorage.getItem('saved_schedules') || '[]');
    } catch { return []; }
  });

  // ── FAZ 4: Manuel Şube Seçimi & Chatbot State ──
  const [customSchedule, setCustomSchedule] = useState(null);
  const [sectionModalData, setSectionModalData] = useState(null);
  const [lockedSections, setLockedSections] = useState({});
  const [isChatOpen, setIsChatOpen] = useState(false);

  // Persist saved schedules to localStorage
  useEffect(() => {
    localStorage.setItem('saved_schedules', JSON.stringify(savedSchedules));
  }, [savedSchedules]);

  // Toast auto-dismiss is handled with hover-to-pause within ToastNotification component

  // Check if TAR101 exists in course data
  const hasTAR101 = useMemo(() => {
    if (!courseData) return false;
    return courseData.courses.some(c => c.code === 'TAR101');
  }, [courseData]);

  const instructorsByCourse = useMemo(() => {
    if (!courseData) return {};
    return extractInstructorsByCourse(courseData.courses);
  }, [courseData]);

  const allCourseCodes = useMemo(() => {
    if (!courseData) return [];
    return courseData.courses.map(c => c.code);
  }, [courseData]);

  // Memoized schedules generation
  const schedules = useMemo(() => {
    if (!courseData) return null;
    return generateSchedules(courseData.courses, freeDays, instructorFilters, 500, lockedSections);
  }, [courseData, freeDays, instructorFilters, lockedSections]);

  // ── FAZ 2: Post-filter with smart filters (AND logic) ──
  const filteredSchedules = useMemo(() => {
    if (!schedules) return null;
    if (!lunchBreakFilter && !sleepyFilter && !historyNoGapFilter) return schedules;

    return schedules.filter(sch => {
      // 1. Lunch Break Filter (12:30 - 13:20) ile N-1 Toleransı:
      // Programdaki aktif ders günlerini say. 12:30-13:20 aralığında ders çakışması olan gün sayısını hesapla.
      // Çakışma sayısı en fazla 1 (<= 1) olan programları da filtreyi geçmiş kabul et.
      if (lunchBreakFilter) {
        const LUNCH_START = 750; // 12:30 = 750 dk
        const LUNCH_END = 800;   // 13:20 = 800 dk
        const daysWithLunchConflict = new Set();
        for (const slot of sch.slots) {
          const sStart = timeToMinutes(slot.start);
          const sEnd = timeToMinutes(slot.end);
          // Katı < ve > sınır kontrolü: 13:30'da başlayan ders (810 dk) < 800 olmadığı için çakışmaz
          if (sStart < LUNCH_END && sEnd > LUNCH_START) {
            daysWithLunchConflict.add(slot.day);
          }
        }
        if (daysWithLunchConflict.size > 1) return false;
      }

      // 2. Sleepy Filter (Toleranslı Algoritma — N-1 Kuralı):
      // Programdaki günlerin en fazla 1 tanesinde 10:00'dan önce başlayan ders bulunmasına izin ver.
      // Geri kalan tüm aktif günlerde dersler 10:00 veya sonrasında başlamalıdır.
      if (sleepyFilter) {
        const daysWithEarlySlot = new Set();
        for (const slot of sch.slots) {
          if (timeToMinutes(slot.start) < 600) { // 10:00 öncesi (08:30, 09:30)
            daysWithEarlySlot.add(slot.day);
          }
        }
        if (daysWithEarlySlot.size > 1) return false;
      }

      // 3. History No Gap (TAR101): TAR101 must be back-to-back with another course on same day
      if (historyNoGapFilter && hasTAR101) {
        const tar101Slots = sch.slots.filter(s => s.courseCode === 'TAR101');
        if (tar101Slots.length > 0) {
          const hasBackToBack = tar101Slots.every(tarSlot => {
            const tarStart = timeToMinutes(tarSlot.start);
            const tarEnd = timeToMinutes(tarSlot.end);
            const sameDayOtherSlots = sch.slots.filter(s =>
              s.day === tarSlot.day && s.courseCode !== 'TAR101'
            );
            if (sameDayOtherSlots.length === 0) return true; // TAR101 alone on that day is fine
            // Check if any other course ends right when TAR101 starts or starts right when TAR101 ends
            return sameDayOtherSlots.some(other => {
              const otherEnd = timeToMinutes(other.end);
              const otherStart = timeToMinutes(other.start);
              // Allow 10 min gap tolerance (e.g., 17:20 end -> 17:30 start)
              return Math.abs(otherEnd - tarStart) <= 10 || Math.abs(tarEnd - otherStart) <= 10;
            });
          });
          if (!hasBackToBack) return false;
        }
      }

      return true;
    });
  }, [schedules, lunchBreakFilter, sleepyFilter, historyNoGapFilter, hasTAR101]);

  // Reset index when filtered schedules change, or jump to pending target schedule
  useEffect(() => {
    if (!filteredSchedules || filteredSchedules.length === 0) {
      setCurrentIndex(0);
      pendingTargetScheduleRef.current = null;
      return;
    }
    if (pendingTargetScheduleRef.current) {
      const targetKey = pendingTargetScheduleRef.current;
      const foundIdx = filteredSchedules.findIndex(s => JSON.stringify(s.selections) === targetKey);
      if (foundIdx >= 0) {
        setCurrentIndex(foundIdx);
      } else {
        setCurrentIndex(0);
      }
      pendingTargetScheduleRef.current = null;
    } else {
      setCurrentIndex(0);
    }
  }, [filteredSchedules]);

  // Handlers
  const handleDayToggle = useCallback((day) => {
    setFreeDays(prev => prev.includes(day) ? prev.filter(d => d !== day) : [...prev, day]);
  }, []);

  const handleFridayToggle = useCallback(() => {
    setFreeDays(prev => prev.includes('Cuma') ? prev.filter(d => d !== 'Cuma') : [...prev, 'Cuma']);
  }, []);

  const handleInstructorToggle = useCallback((courseCode, instName) => {
    setInstructorFilters(prev => {
      const cur = prev[courseCode] ? [...prev[courseCode]] : [];
      const updated = cur.includes(instName) ? cur.filter(x => x !== instName) : [...cur, instName];
      return { ...prev, [courseCode]: updated };
    });
  }, []);

  const handleSelectAll = useCallback((courseCode) => {
    const list = instructorsByCourse[courseCode] || [];
    setInstructorFilters(prev => ({ ...prev, [courseCode]: list.map(i => i.name) }));
  }, [instructorsByCourse]);

  const handleClearAll = useCallback((courseCode) => {
    setInstructorFilters(prev => ({ ...prev, [courseCode]: [] }));
  }, []);

  const handleBlockClick = useCallback((block, rect) => {
    setActivePopover({
      block,
      x: Math.min(rect.right + 10, window.innerWidth - 370),
      y: Math.min(rect.top, window.innerHeight - 320)
    });
  }, []);

  const handleClosePopover = useCallback(() => {
    setActivePopover(null);
  }, []);

  const handleToggleExportMenu = useCallback(() => {
    setIsExportMenuOpen(prev => !prev);
  }, []);

  // ── FAZ 2: Smart filter toggles ──
  const handleLunchBreakToggle = useCallback(() => {
    setLunchBreakFilter(prev => !prev);
  }, []);

  const handleSleepyToggle = useCallback(() => {
    setSleepyFilter(prev => !prev);
  }, []);

  const handleHistoryNoGapToggle = useCallback(() => {
    setHistoryNoGapFilter(prev => !prev);
  }, []);

  // ── FAZ 2: Dev toast ──
  const handleShowDevToast = useCallback(() => {
    setToastData({
      icon: '🚧',
      message: 'Henüz geliştirme aşamasında! Diğer bölümler yakında eklenecek.',
      type: 'warning'
    });
  }, []);

  const handleDismissToast = useCallback(() => {
    setToastData(prev => prev ? { ...prev, exiting: true } : null);
    setTimeout(() => setToastData(null), 250);
  }, []);

  // ── FAZ 2: Bookmark handlers ──
  const isCurrentSaved = useMemo(() => {
    const current = customSchedule || (filteredSchedules && filteredSchedules[currentIndex]) || null;
    if (!current) return false;
    return savedSchedules.some(s =>
      JSON.stringify(s.selections) === JSON.stringify(current.selections)
    );
  }, [filteredSchedules, currentIndex, customSchedule, savedSchedules]);

  const handleToggleBookmark = useCallback(() => {
    const current = customSchedule || (filteredSchedules && filteredSchedules[currentIndex]) || null;
    if (!current) return;

    const selKey = JSON.stringify(current.selections);
    const exists = savedSchedules.findIndex(s => JSON.stringify(s.selections) === selKey);

    if (exists >= 0) {
      setSavedSchedules(prev => prev.filter((_, i) => i !== exists));
      setToastData({ icon: '🗑️', message: 'Program favorilerden kaldırıldı.', type: 'warning' });
    } else {
      // Tam kopya (deep snapshot) olarak kaydet
      const snapshotSelections = JSON.parse(JSON.stringify(current.selections));
      const snapshotSlots = JSON.parse(JSON.stringify(current.slots));
      const snapshotScore = JSON.parse(JSON.stringify(current.score));

      setSavedSchedules(prev => [...prev, {
        originalIndex: customSchedule ? (customSchedule.originalIndex ?? 0) : currentIndex,
        selections: snapshotSelections,
        slots: snapshotSlots,
        score: snapshotScore,
        savedAt: new Date().toISOString()
      }]);
      setToastData({ icon: '⭐', message: 'Program favorilere kaydedildi!', type: 'warning' });
    }
  }, [filteredSchedules, currentIndex, customSchedule, savedSchedules]);

  const handleRemoveSaved = useCallback((idx) => {
    setSavedSchedules(prev => prev.filter((_, i) => i !== idx));
    setToastData({ icon: '🗑️', message: 'Favori kaldırıldı.', type: 'warning' });
  }, []);

  // ── FAZ 3: Global Reset ──
  const handleGlobalReset = useCallback(() => {
    const map = extractInstructorsByCourse(courseData ? courseData.courses : DEFAULT_DATA.courses);
    const resetFilters = {};
    for (const [code, insts] of Object.entries(map)) {
      resetFilters[code] = insts.map(i => i.name);
    }
    setInstructorFilters(resetFilters);
    setLockedSections({});
    setFreeDays([]);
    setLunchBreakFilter(false);
    setSleepyFilter(false);
    setHistoryNoGapFilter(false);
    setCustomSchedule(null);
    setCurrentIndex(0);
    setToastData({ icon: '🔄', message: 'Tüm filtreler ve kısıtlar varsayılan durumuna sıfırlandı.', type: 'warning' });
  }, [courseData]);

  // ── FAZ 4: Manuel Şube Seçimi & Chatbot Handlers ──
  const handleOpenSectionModal = useCallback((unitData) => {
    if (unitData) {
      setSectionModalData({
        courseCode: unitData.courseCode,
        component: unitData.component || 'all',
        currentSection: unitData.section || unitData.currentSection || 1
      });
    } else {
      const firstCourse = courseData ? courseData.courses[0]?.code : DEFAULT_DATA.courses[0]?.code;
      setSectionModalData({
        courseCode: firstCourse || 'BM101',
        component: 'all',
        currentSection: 1
      });
    }
  }, [courseData]);

  const handleApplyManualSection = useCallback((courseCode, component, targetSection, isForcedConflict) => {
    const baseSchedule = customSchedule || (filteredSchedules && filteredSchedules[currentIndex]) || null;
    const courses = courseData ? courseData.courses : DEFAULT_DATA.courses;
    const targetCourse = courses.find(c => c.code === courseCode);
    if (!targetCourse) return;

    const compType = component || 'all';
    const targetUnitId = targetCourse.type === 'common' ? courseCode : `${courseCode}_${compType}`;

    // 1. Yeni seçilen şube kuralı hazırlanır
    const nextLocked = { ...lockedSections, [targetUnitId]: targetSection.section };

    // Hedef dersin hocası filtrelenmişse aç
    let nextInstructorFilters = { ...instructorFilters };
    if (targetSection.instructor) {
      const curInsts = nextInstructorFilters[courseCode] || [];
      if (!curInsts.includes(targetSection.instructor)) {
        nextInstructorFilters[courseCode] = [...curInsts, targetSection.instructor];
      }
    }

    // Seçilen şubenin ders günleri freeDays içindeyse o günleri serbest bırak
    let updatedFreeDays = [...freeDays];
    const targetDays = new Set(targetSection.slots.map(s => s.day));
    if (updatedFreeDays.some(d => targetDays.has(d))) {
      updatedFreeDays = updatedFreeDays.filter(d => !targetDays.has(d));
    }

    // 2. Mevcut programda bu şube ile çakışan diğer derslerin şubeleri serbest bırakılsın
    if (baseSchedule) {
      baseSchedule.selections.forEach(sel => {
        if (sel.courseCode === courseCode && (compType === 'all' || sel.component === compType)) return;
        const hasTimeConflict = sel.slots.some(s =>
          targetSection.slots.some(ts => doTimesOverlap(s, ts))
        );
        if (hasTimeConflict) {
          // Çakışan ders serbest bırakılıyor: kilitlerden kaldır
          const confUnitId = sel.unitId || (sel.component === 'all' ? sel.courseCode : `${sel.courseCode}_${sel.component}`);
          delete nextLocked[confUnitId];
          // Çakışan ders için tüm hocaları açarak sıfır çakışmalı alternatif bulma alanını genişlet
          const allInstsForCourse = (instructorsByCourse[sel.courseCode] || []).map(i => i.name);
          if (allInstsForCourse.length > 0) {
            nextInstructorFilters[sel.courseCode] = allInstsForCourse;
          }
        }
      });
    }

    // 3. AŞAMALI ÇÖZÜMLEME MOTORU (Tüm olasılıkları dene ve uygun sonuçları bul)
    // Aşama 1: Serbest bırakılan çakışan derslerle mevcut kısıtlar altında dene
    let calculatedSchedules = generateSchedules(courses, updatedFreeDays, nextInstructorFilters, 500, nextLocked, baseSchedule ? baseSchedule.selections : []);

    // Aşama 2: Sonuç yoksa boş gün kısıtlarını (freeDays) tamamen kaldırıp dene
    if (calculatedSchedules.length === 0 && updatedFreeDays.length > 0) {
      updatedFreeDays = [];
      calculatedSchedules = generateSchedules(courses, [], nextInstructorFilters, 500, nextLocked, baseSchedule ? baseSchedule.selections : []);
    }

    // Aşama 3: Sonuç yoksa diğer tüm derslerin hoca kısıtlarını serbest bırak (üniversite müfredatındaki tüm şubeleri tara)
    if (calculatedSchedules.length === 0) {
      for (const c of courses) {
        if (c.code !== courseCode) {
          const allInsts = (instructorsByCourse[c.code] || []).map(i => i.name);
          if (allInsts.length > 0) {
            nextInstructorFilters[c.code] = allInsts;
          }
        }
      }
      calculatedSchedules = generateSchedules(courses, updatedFreeDays, nextInstructorFilters, 500, nextLocked, baseSchedule ? baseSchedule.selections : []);
    }

    // Aşama 4: Sonuç yoksa daha önceki diğer ders kilitlerini serbest bırak, YALNIZCA bu seçilen şubeyi kilitle
    if (calculatedSchedules.length === 0 && Object.keys(nextLocked).length > 1) {
      const singleLock = { [targetUnitId]: targetSection.section };
      calculatedSchedules = generateSchedules(courses, updatedFreeDays, nextInstructorFilters, 500, singleLock, baseSchedule ? baseSchedule.selections : []);
      if (calculatedSchedules.length > 0) {
        Object.keys(nextLocked).forEach(k => { if (k !== targetUnitId) delete nextLocked[k]; });
      }
    }

    // 4. EĞER HİÇBİR ŞEKİLDE UYGUN ÇAKIŞMASIZ PROGRAM BULUNAMIYORSA:
    // (Örn. FIZ103 Şube 3 veya MATH101 Şube 1, tek şubeli zorunlu BM103 ile aynı saatte çakışıyorsa matematiksel olarak sıfır çakışmalı program imkansızdır)
    if (calculatedSchedules.length === 0) {
      // KULLANICININ İSTEDİĞİ GİBİ:
      // Sayfayı boş ekrana düşürme; son varsayılan/aktif program ekranda kalsın, kullanıcıya bilgi ver!
      setSectionModalData(null);
      setToastData({
        icon: '⚠️',
        message: `${courseCode} Şube ${targetSection.section} tek şubeli zorunlu derslerle (BM103 vb.) doğrudan çakıştığı için uygun program bulunamadı. Son geçerli programınız korundu.`,
        type: 'warning'
      });
      return;
    }

    // 5. UYGUN SONUÇLAR BULUNDU:
    // Akıllı filtreler bu yeni sonuçları sıfıra düşürmesin diye esnet
    setLunchBreakFilter(false);
    setSleepyFilter(false);
    setHistoryNoGapFilter(false);

    setLockedSections(nextLocked);
    setInstructorFilters(nextInstructorFilters);
    if (updatedFreeDays.length !== freeDays.length) {
      setFreeDays(updatedFreeDays);
    }
    setCustomSchedule(null);
    setCurrentIndex(0);
    setSectionModalData(null);

    const matchCount = calculatedSchedules.length;
    setToastData({
      icon: '✨',
      message: `${courseCode} Şube ${targetSection.section} kilitlendi. Sıfır çakışmalı ${matchCount} uygun program bulundu! 🎉`,
      type: 'success'
    });
  }, [lockedSections, instructorFilters, freeDays, customSchedule, filteredSchedules, currentIndex, courseData, instructorsByCourse]);

  const handleChatbotCommand = useCallback((rawQuery) => {
    const norm = normalizeTurkish(rawQuery);
    const courses = courseData ? courseData.courses : DEFAULT_DATA.courses;
    const actions = [];

    // 1. Reset check
    if (/(?:sifirla|reset|temizle|varsayilan|tum filtreleri kaldir|basa don)/i.test(norm)) {
      const map = extractInstructorsByCourse(courses);
      const resetFilters = {};
      for (const [code, insts] of Object.entries(map)) {
        resetFilters[code] = insts.map(i => i.name);
      }
      setInstructorFilters(resetFilters);
      setLockedSections({});
      setFreeDays([]);
      setLunchBreakFilter(false);
      setSleepyFilter(false);
      setHistoryNoGapFilter(false);
      setCustomSchedule(null);
      setCurrentIndex(0);
      return {
        success: true,
        count: 0,
        message: 'Tüm filtreler ve kısıtlar varsayılan durumuna sıfırlandı. Tüm şube ve programlar yeniden aktif!'
      };
    }

    let nextInstructorFilters = { ...instructorFilters };
    let nextFreeDays = [...freeDays];
    let nextLunch = lunchBreakFilter;
    let nextSleepy = sleepyFilter;
    let nextHistory = historyNoGapFilter;
    let manualAssignment = null;

    // 2. Instructor check
    const allInstsWithCourse = [];
    courses.forEach(c => {
      const instList = instructorsByCourse[c.code] || [];
      instList.forEach(inst => {
        allInstsWithCourse.push({
          courseCode: c.code,
          courseName: c.name,
          name: inst.name,
          normName: normalizeTurkish(inst.name)
        });
      });
    });

    allInstsWithCourse.forEach(item => {
      const parts = item.normName.split(' ').filter(p => !['doc', 'dr', 'prof', 'ogr', 'gor', 'uyesi', 'ars'].includes(p) && p.length > 2);
      const isMentioned = parts.some(part => norm.includes(part));
      if (isMentioned) {
        const isNegated = new RegExp(`(?:${parts.join('|')})(?:\\s+(?:hoca|hocam|ogretim|uyesi))*\\s*(?:olmasin|istemiyorum|haric|harici|cikar|olmasa)`, 'i').test(norm);
        if (isNegated) {
          nextInstructorFilters[item.courseCode] = (nextInstructorFilters[item.courseCode] || []).filter(x => x !== item.name);
          actions.push(`${item.name.split(' ').slice(-1)[0]} Hoca (${item.courseCode}) filtresi kaldırıldı`);
        } else {
          nextInstructorFilters[item.courseCode] = [item.name];
          const shortName = item.name.includes('Esra') ? 'Esra Hoca'
            : item.name.includes('Feyza') ? 'Feyza Yıldırım'
            : item.name.includes('Hüseyin') ? 'Hüseyin Hoca'
            : item.name.includes('Şerife') ? 'Şerife Hoca'
            : item.name.includes('Yunus') ? 'Yunus Hoca'
            : item.name.includes('Kıvanç') ? 'Kıvanç Hoca'
            : item.name.split(' ').slice(-1)[0] + ' Hoca';
          actions.push(`${shortName} seçildi`);
        }
      }
    });

    // 3. Time / Sleepy check
    if (/(?:sabah\s*olmasin|sabah\s*ders\s*istemiyorum|erken\s*olmasin|uykucu|gec\s*baslasin|10\s*dan\s*sonra|10\s*00\s*dan\s*sonra|10\s*dan\s*sonraya|ogleden\s*sonra)/i.test(norm)) {
      nextSleepy = true;
      actions.push('dersler 10:00 sonrasına ayarlandı');
    } else if (/(?:sabah\s*olsun|uykucu\s*kapat|erken\s*olabilir)/i.test(norm)) {
      nextSleepy = false;
      actions.push('erken saat kısıtlaması kaldırıldı');
    }

    // 4. Lunch break check
    if (/(?:ogle\s*molasi|ogle\s*arasi|yemek\s*arasi|12\s*30\s*bos|ogle\s*yemegi)/i.test(norm)) {
      if (/(?:olmasin|kapat|istemiyorum)/i.test(norm)) {
        nextLunch = false;
        actions.push('öğle molası filtresi kapatıldı');
      } else {
        nextLunch = true;
        actions.push('öğle molası bırakıldı');
      }
    }

    // 5. Free Day check
    if (/(?:cuma\s*bos|cuma\s*tatil|cuma\s*olmasin|cuma\s*ders\s*istemiyorum|cumayi\s*bos)/i.test(norm)) {
      if (!nextFreeDays.includes('Cuma')) nextFreeDays.push('Cuma');
      actions.push('Cuma tatil yapıldı');
    } else if (/(?:cuma\s*ac|cuma\s*ders\s*olsun|cumaya\s*ders)/i.test(norm)) {
      nextFreeDays = nextFreeDays.filter(d => d !== 'Cuma');
      actions.push('Cuma derslere açıldı');
    }

    ['pazartesi', 'sali', 'carsamba', 'persembe'].forEach(dName => {
      const dayCap = dName === 'pazartesi' ? 'Pazartesi' : dName === 'sali' ? 'Salı' : dName === 'carsamba' ? 'Çarşamba' : 'Perşembe';
      if (new RegExp(`${dName}\\s*(?:bos|tatil|olmasin)`, 'i').test(norm)) {
        if (!nextFreeDays.includes(dayCap)) nextFreeDays.push(dayCap);
        actions.push(`${dayCap} tatil yapıldı`);
      }
    });

    // 6. Section assignment (e.g., "BM101 Şube 2 olsun", "fizik 3. şube")
    const secMatch = norm.match(/(bm101|bm103|mat199|fiz103|math101|eng103|tar101|fizik|matematik|programlama)\s*(?:dersi)?\s*(?:sube|subesi|s\.|ş\.|s|ş)?\s*(\d+)/i);
    if (secMatch) {
      let rawCode = secMatch[1].toUpperCase();
      if (rawCode === 'FIZIK') rawCode = 'FIZ103';
      if (rawCode === 'MATEMATIK') rawCode = 'MATH101';
      if (rawCode === 'PROGRAMLAMA') rawCode = 'BM101';
      const targetSecNum = parseInt(secMatch[2], 10);
      const targetCourse = courses.find(c => c.code === rawCode);
      if (targetCourse) {
        manualAssignment = { course: targetCourse, sectionNum: targetSecNum };
        actions.push(`${targetCourse.code} Şube ${targetSecNum} olarak ayarlandı`);
      }
    }

    // 7. History gapless check
    if (/(?:tarih\s*bosluksuz|tarihi\s*yolda|tar101\s*araliksiz)/i.test(norm)) {
      nextHistory = true;
      actions.push('tarih dersi boşluksuz ayarlandı');
    }

    if (actions.length === 0) {
      return {
        success: false,
        count: 0,
        message: 'Anlayamadım. Örneğin şunları yazabilirsiniz:\n• "Esra Hoca ve sabah olmasın"\n• "Feyza Yıldırım seç"\n• "BM101 Şube 2 olsun"\n• "Cuma boş olsun"\n• "Öğle molası ver"\n• "Tüm filtreleri sıfırla"'
      };
    }

    // Simulate result count
    const simSchedules = generateSchedules(courses, nextFreeDays, nextInstructorFilters, 500);
    const simFiltered = simSchedules.filter(sch => {
      if (nextLunch) {
        const LUNCH_START = 750, LUNCH_END = 800;
        const daysWithLunch = new Set();
        for (const slot of sch.slots) {
          if (timeToMinutes(slot.start) < LUNCH_END && timeToMinutes(slot.end) > LUNCH_START) {
            daysWithLunch.add(slot.day);
          }
        }
        if (daysWithLunch.size > 1) return false;
      }
      if (nextSleepy) {
        const daysWithEarly = new Set();
        for (const slot of sch.slots) {
          if (timeToMinutes(slot.start) < 600) daysWithEarly.add(slot.day);
        }
        if (daysWithEarly.size > 1) return false;
      }
      if (nextHistory && hasTAR101) {
        const tarSlots = sch.slots.filter(s => s.courseCode === 'TAR101');
        if (tarSlots.length > 0) {
          const hasBackToBack = tarSlots.every(tarSlot => {
            const tarStart = timeToMinutes(tarSlot.start);
            const tarEnd = timeToMinutes(tarSlot.end);
            const sameDayOthers = sch.slots.filter(s => s.day === tarSlot.day && s.courseCode !== 'TAR101');
            if (sameDayOthers.length === 0) return true;
            return sameDayOthers.some(other => {
              const oEnd = timeToMinutes(other.end);
              const oStart = timeToMinutes(other.start);
              return Math.abs(oEnd - tarStart) <= 10 || Math.abs(tarEnd - oStart) <= 10;
            });
          });
          if (!hasBackToBack) return false;
        }
      }
      return true;
    });

    // Apply all filter state updates simultaneously
    setInstructorFilters(nextInstructorFilters);
    setFreeDays(nextFreeDays);
    setSleepyFilter(nextSleepy);
    setLunchBreakFilter(nextLunch);
    setHistoryNoGapFilter(nextHistory);
    setCustomSchedule(null);
    setCurrentIndex(0);

    if (manualAssignment) {
      const { course, sectionNum } = manualAssignment;
      const comp = course.type === 'departmental' ? 'theory' : 'all';
      const compObj = course.type === 'departmental' ? course.components.find(c => c.component === comp) : course.components[0];
      const targetSec = compObj?.sections.find(s => s.section === sectionNum);
      if (targetSec) {
        handleApplyManualSection(course.code, comp, targetSec, false);
      }
    }

    const matchingCount = simFiltered.length;
    const actionText = actions.join(' ve ');
    const capitalized = actionText.charAt(0).toUpperCase() + actionText.slice(1);

    const finalMsg = matchingCount > 0
      ? `${capitalized}. Uygun ${matchingCount} program bulundu! 🎉`
      : `${capitalized}, ancak bu kriterlere uygun çakışmasız program bulunamadı. Filtreleri esnetmeyi veya 'sıfırla' demeyi deneyebilirsiniz.`;

    return {
      success: true,
      count: matchingCount,
      message: finalMsg
    };
  }, [courseData, instructorFilters, freeDays, lunchBreakFilter, sleepyFilter, historyNoGapFilter, instructorsByCourse, hasTAR101, handleApplyManualSection]);

  // ── FAZ 3: State Snapshot Hydration (Kayıtlı Programı Doğrudan Geri Yükleme) ──
  const handleLoadSavedSchedule = useCallback((saved) => {
    if (!saved || !saved.slots || !saved.selections) return;

    // 1. Kaydedilen programdaki ders ve hocaları analiz et
    const newFilters = {};
    for (const code of allCourseCodes) {
      newFilters[code] = [];
    }
    saved.slots.forEach(slot => {
      if (slot.courseCode && slot.instructor) {
        if (!newFilters[slot.courseCode]) {
          newFilters[slot.courseCode] = [];
        }
        if (!newFilters[slot.courseCode].includes(slot.instructor)) {
          newFilters[slot.courseCode].push(slot.instructor);
        }
      }
    });
    // Hoca bilgisi belirtilmemiş dersler için tüm hocaları koru
    for (const code of allCourseCodes) {
      if (!newFilters[code] || newFilters[code].length === 0) {
        const instList = instructorsByCourse[code] || [];
        newFilters[code] = instList.map(i => i.name);
      }
    }

    // 2. Kayıtlı programdaki günlerle çakışan freeDays varsa kaldır (sol panel ile senkronizasyon)
    const daysInSaved = new Set(saved.slots.map(s => s.day));
    setFreeDays(prev => prev.filter(d => !daysInSaved.has(d)));

    // 3. Sol paneldeki hoca seçim filtrelerini kaydedilen programdaki hocalara göre senkronize et
    setInstructorFilters(newFilters);

    // 4. Doğrudan o snapshot'taki dersleri, şubeleri ve hocaları aktif tablo görünümüne enjekte et (hydrate/override)
    const hydratedSchedule = {
      selections: JSON.parse(JSON.stringify(saved.selections)),
      slots: JSON.parse(JSON.stringify(saved.slots)),
      score: JSON.parse(JSON.stringify(saved.score)),
      isCustom: true,
      isSavedHydrated: true,
      originalIndex: saved.originalIndex
    };
    setCustomSchedule(hydratedSchedule);

    // 5. Görüntüleyiciye yumuşak kaydır ve kullanıcıya bilgi ver
    window.scrollTo({ top: 0, behavior: 'smooth' });
    setToastData({
      icon: '⭐',
      message: `Program #${saved.originalIndex + 1} eksiksiz geri yüklendi (Hoca filtreleri senkronize edildi).`,
      type: 'warning'
    });
  }, [allCourseCodes, instructorsByCourse]);

  // Global click listener to close popover / export menu
  useEffect(() => {
    const onGlobalClick = () => {
      setActivePopover(null);
      setIsExportMenuOpen(false);
    };
    window.addEventListener('click', onGlobalClick);
    return () => window.removeEventListener('click', onGlobalClick);
  }, []);

  // Keyboard navigation — use filteredSchedules
  useEffect(() => {
    const onKeyDown = (e) => {
      if (!filteredSchedules || filteredSchedules.length === 0) return;
      if (e.target.tagName === 'INPUT') return;
      const total = filteredSchedules.length;

      if (e.key === 'ArrowLeft') {
        e.preventDefault();
        setCurrentIndex(i => Math.max(0, i - 1));
      } else if (e.key === 'ArrowRight') {
        e.preventDefault();
        setCurrentIndex(i => Math.min(total - 1, i + 1));
      } else if (e.key === 'Home') {
        e.preventDefault();
        setCurrentIndex(0);
      } else if (e.key === 'End') {
        e.preventDefault();
        setCurrentIndex(total - 1);
      }
    };
    window.addEventListener('keydown', onKeyDown);
    return () => window.removeEventListener('keydown', onKeyDown);
  }, [filteredSchedules]);

  const currentSchedule = customSchedule || (filteredSchedules && filteredSchedules[currentIndex]) || null;

  return h('div', { className: 'app' },
    // Toast
    h(ToastNotification, { toast: toastData, onDismiss: handleDismissToast }),

    // Enhanced Header
    h(HeaderEnhanced, { theme, onToggleTheme: handleToggleTheme, onShowDevToast: handleShowDevToast }),

    h('div', { className: 'main-layout' },
      h('div', { className: 'sidebar' },
        h(CourseInput, { courseData }),
        h(GlobalResetButton, { onReset: handleGlobalReset }),
        h(ConstraintPanel, {
          freeDays,
          onDayToggle: handleDayToggle,
          onFridayToggle: handleFridayToggle
        }),
        // Smart Filters Panel
        h(SmartFiltersPanel, {
          lunchBreak: lunchBreakFilter,
          onLunchBreakToggle: handleLunchBreakToggle,
          sleepy: sleepyFilter,
          onSleepyToggle: handleSleepyToggle,
          historyNoGap: historyNoGapFilter,
          onHistoryNoGapToggle: handleHistoryNoGapToggle,
          hasTAR101
        }),
        h(InstructorFiltersPanel, {
          instructorsByCourse,
          instructorFilters,
          onInstructorToggle: handleInstructorToggle,
          onSelectAll: handleSelectAll,
          onClearAll: handleClearAll
        })
      ),

      h('div', null,
        !filteredSchedules ? (
          h('div', { className: 'panel' },
            h('div', { className: 'empty-state' },
              h('div', { className: 'empty-state__icon' }, '🎓'),
              h('div', { className: 'empty-state__title' }, 'Program Oluşturmaya Hazır')
            )
          )
        ) : filteredSchedules.length === 0 && !customSchedule ? (
          h('div', { className: 'panel' },
            h('div', { className: 'empty-state' },
              h('div', { className: 'empty-state__icon' }, '🔍'),
              h('div', { className: 'empty-state__title', style: { color: 'var(--accent-warning)' } },
                'Seçilen Kriterlere Uygun Program Bulunamadı'
              ),
              h('div', { className: 'empty-state__text' },
                'Lütfen sol taraftaki hoca seçimlerini genişletin, boş gün kısıtını kaldırın veya filtreleri sıfırlayın.'
              ),
              h('button', {
                type: 'button',
                className: 'btn-conflict-confirm',
                style: { marginTop: '16px', padding: '8px 18px', fontSize: '0.78rem' },
                onClick: handleGlobalReset
              }, '🔄 Tüm Filtreleri Sıfırla & Varsayılan Programı Göster')
            )
          )
        ) : (
          h('div', { className: 'panel fade-in', id: 'schedule-results-panel' },
            h('div', { className: 'panel__header' },
              h('div', { className: 'panel__icon' }, '📅'),
              h('div', null,
                h('h2', { className: 'panel__title' }, 'Ders Programı'),
                h('div', { style: { fontSize: '0.68rem', color: 'var(--text-tertiary)' } },
                  customSchedule
                    ? 'Manuel şube seçimi ile özelleştirilmiş aktif program'
                    : schedules && schedules.length !== filteredSchedules.length
                      ? `${filteredSchedules.length} / ${schedules.length} program (filtreli)`
                      : 'Ders bloklarına tıklayarak hoca ve alternatif şubeleri inceleyebilirsiniz'
                )
              ),
              h('div', { style: { marginLeft: 'auto', display: 'flex', alignItems: 'center', gap: '8px' } },
                h(BookmarkButton, { isSaved: isCurrentSaved, onToggle: handleToggleBookmark }),
                h('span', {
                  className: `compact-label compact-label--${currentSchedule.score.compactnessClass}`
                }, currentSchedule.score.compactnessBadge),
                h(ExportDropdown, {
                  isOpen: isExportMenuOpen,
                  onToggle: handleToggleExportMenu,
                  onExport: (format) => exportSchedule(
                    format,
                    customSchedule ? 0 : currentIndex,
                    customSchedule ? [customSchedule] : filteredSchedules
                  )
                })
              )
            ),

            h('div', { className: 'panel__body' },
              // Custom Schedule Notification Banner
              customSchedule ? (
                h('div', { className: 'custom-schedule-banner' },
                  h('div', { className: 'custom-schedule-banner__text' },
                    h('span', null, customSchedule.isSavedHydrated ? '⭐' : '✏️'),
                    customSchedule.isSavedHydrated
                      ? `Kayıtlı Favori Program #${(customSchedule.originalIndex ?? 0) + 1} Görüntüleniyor`
                      : 'Manuel Şube Seçimi ile Özelleştirilmiş Program Görüntüleniyor'
                  ),
                  h('button', {
                    type: 'button',
                    className: 'btn-reset-custom',
                    onClick: () => setCustomSchedule(null)
                  }, 'Otomatik Çözümlere Dön')
                )
              ) : null,

              h(StatsGrid, {
                total: customSchedule ? 1 : filteredSchedules.length,
                score: currentSchedule.score
              }),

              !customSchedule ? (
                h(AdvancedPagination, {
                  currentIndex,
                  total: filteredSchedules.length,
                  onIndexChange: (idx) => {
                    setCustomSchedule(null);
                    setCurrentIndex(idx);
                  }
                })
              ) : null,

              h('div', { style: { marginBottom: '16px' } },
                h('div', { style: { display: 'flex', justifyContent: 'space-between', marginBottom: '4px' } },
                  h('span', { style: { fontSize: '0.72rem', color: 'var(--text-tertiary)', fontWeight: '600' } }, 'Zaman Kompaktlığı'),
                  h('span', { style: { fontSize: '0.72rem', color: 'var(--text-secondary)' } },
                    `Günlük ortalama ${currentSchedule.score.avgGapPerDay} dk ara`
                  )
                ),
                h('div', { className: 'score-bar' },
                  h('div', {
                    className: `score-bar__fill score-bar__fill--${currentSchedule.score.compactnessClass}`,
                    style: { width: `${Math.max(5, 100 - (currentSchedule.score.totalGap / 3))}%` }
                  })
                )
              ),

              h(ScheduleTable, {
                schedule: currentSchedule,
                allCourseCodes,
                onBlockClick: handleBlockClick,
                onOpenSectionModal: handleOpenSectionModal
              }),

              // Interactive Selection Tags & Branch Switcher
              h('div', { className: 'sel-tags-wrapper' },
                h('div', { className: 'sel-tags-header' },
                  h('div', { className: 'sel-tags-header__left' },
                    h('span', null, '🔀'),
                    h('strong', { className: 'sel-tags-header__title' }, 'Seçili Şube Kombinasyonları:'),
                    h('span', { className: 'sel-tags-header__hint' }, '(Şube değiştirmek için derse tıklayın)')
                  ),
                  h('button', {
                    type: 'button',
                    className: 'btn-open-section-modal',
                    onClick: () => handleOpenSectionModal(null)
                  }, '⚡ Manuel Şube Değiştir / Kontenjan')
                ),
                h('div', { className: 'sel-tags' },
                  currentSchedule.selections.map((sel, idx) => {
                    const comp = sel.component !== 'all' ? (sel.component === 'lab' ? ' Lab' : ' Teori') : '';
                    const altText = sel.hasAlternative ? ` (Alt: ${sel.allSections.map(s => `Ş.${s.section}`).join(', ')})` : '';
                    return h('button', {
                      key: idx,
                      type: 'button',
                      className: 'sel-tag sel-tag--clickable',
                      title: `${sel.courseCode} için şubeleri incele ve manuel değiştir`,
                      onClick: () => handleOpenSectionModal({
                        courseCode: sel.courseCode,
                        component: sel.component || 'all',
                        currentSection: sel.section
                      })
                    },
                      h('span', null, `${sel.courseCode}${comp} → Ş.${sel.section}${altText}`),
                      h('span', { className: 'sel-tag__action' }, '⇄')
                    );
                  })
                )
              )
            )
          )
        ),

        // Saved Schedules Panel (Alternatiflerim)
        h(SavedSchedulesPanel, {
          savedSchedules,
          onLoadSchedule: handleLoadSavedSchedule,
          onRemove: handleRemoveSaved
        })
      )
    ),

    h(PopoverCard, {
      popoverData: activePopover,
      onClose: handleClosePopover,
      onOpenSectionModal: handleOpenSectionModal
    }),

    // Section Selection Modal
    h(SectionSelectModal, {
      isOpen: Boolean(sectionModalData),
      modalData: sectionModalData,
      courseData,
      currentSchedule,
      onClose: () => setSectionModalData(null),
      onApplySection: handleApplyManualSection
    }),

    // Chatbot Assistant Widget
    h(ChatbotWidget, {
      isOpen: isChatOpen,
      onToggle: () => setIsChatOpen(prev => !prev),
      onExecuteCommand: handleChatbotCommand
    }),

    // Footer Signature
    h(FooterSignature)
  );
}

// ============================================================
// EXPORT ENGINE
// ============================================================
async function exportSchedule(format, currentIdx, schedules) {
  const sch = schedules[currentIdx];
  const prefix = `ders_programi_alternatif_${currentIdx + 1}`;

  if (format === 'json') {
    const data = {
      programNo: currentIdx + 1,
      toplamProgram: schedules.length,
      kompaktlikSkoru: sch.score,
      dersler: sch.selections.map(s => ({
        dersKodu: s.courseCode,
        dersAdi: s.courseName,
        bilesen: s.component,
        secilenSube: s.section,
        ayniSaattekiAlternatifSubeler: s.allSections || [],
        saatler: s.slots.map(sl => ({
          gun: sl.day,
          baslangic: sl.start,
          bitis: sl.end,
          hoca: sl.instructor,
          derslik: sl.room
        }))
      }))
    };
    downloadBlob(new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' }), `${prefix}.json`);
    return;
  }

  if (format === 'excel') {
    exportToExcel(sch, prefix);
    return;
  }

  const captureEl = document.getElementById('schedule-capture-area');
  if (!captureEl) return;

  if (typeof html2canvas === 'function') {
    try {
      const isLight = document.documentElement.getAttribute('data-theme') === 'light';
      const canvas = await html2canvas(captureEl, {
        scale: 2,
        backgroundColor: isLight ? '#ffffff' : '#0a0e1a',
        useCORS: true,
        logging: false
      });

      if (format === 'png') {
        canvas.toBlob((blob) => {
          downloadBlob(blob, `${prefix}.png`);
        }, 'image/png');
      } else if (format === 'jpeg') {
        canvas.toBlob((blob) => {
          downloadBlob(blob, `${prefix}.jpg`, 0.95);
        }, 'image/jpeg', 0.95);
      } else if (format === 'pdf') {
        if (window.jspdf && window.jspdf.jsPDF) {
          const { jsPDF } = window.jspdf;
          const pdf = new jsPDF('landscape', 'pt', 'a4');
          const pdfWidth = pdf.internal.pageSize.getWidth();
          const pdfHeight = pdf.internal.pageSize.getHeight();

          pdf.setFillColor(isLight ? 255 : 10, isLight ? 255 : 14, isLight ? 255 : 26);
          pdf.rect(0, 0, pdfWidth, pdfHeight, 'F');

          pdf.setFontSize(16);
          pdf.setTextColor(isLight ? 20 : 240, isLight ? 30 : 245, isLight ? 50 : 255);
          pdf.text(`Gazi Üniversitesi Ders Programı — Alternatif ${currentIdx + 1} / ${schedules.length}`, 30, 35);

          pdf.setFontSize(10);
          pdf.setTextColor(isLight ? 100 : 150, isLight ? 110 : 160, isLight ? 130 : 180);
          pdf.text(`Aktif Gün: ${sch.score.activeDays} | Boşluk: ${sch.score.totalGap} dk | Haftalık Ders: ${sch.score.totalHours} saat`, 30, 52);

          const imgData = canvas.toDataURL('image/png');
          const availableWidth = pdfWidth - 60;
          const availableHeight = pdfHeight - 80;
          const imgRatio = canvas.width / canvas.height;
          let renderW = availableWidth;
          let renderH = availableWidth / imgRatio;

          if (renderH > availableHeight) {
            renderH = availableHeight;
            renderW = availableHeight * imgRatio;
          }

          pdf.addImage(imgData, 'PNG', 30, 65, renderW, renderH);
          pdf.save(`${prefix}.pdf`);
        } else {
          window.print();
        }
      }
    } catch (err) {
      console.error('Export error:', err);
      if (format === 'pdf') window.print();
      else alert('Görsel oluşturulurken bir hata meydana geldi: ' + err.message);
    }
  } else {
    if (format === 'pdf') window.print();
    else alert('Yazdırma seçeneğini kullanabilirsiniz.');
  }
}

function exportToExcel(sch, prefix) {
  if (window.XLSX && window.XLSX.utils) {
    const wb = window.XLSX.utils.book_new();

    const activeDays = DAYS.filter(d => sch.slots.some(s => s.day === d));
    const matrixData = [['Saat', ...activeDays]];

    TIME_SLOTS.forEach((slot, si) => {
      const row = [SLOT_LABELS[si]];
      activeDays.forEach(day => {
        const found = sch.slots.find(s => {
          const sIdx = getSlotIndex(s.start);
          const span = getSlotSpan(s.start, s.end);
          return s.day === day && si >= sIdx && si < sIdx + span;
        });
        if (found) {
          const alt = found.hasAlternative ? ' [Alt Şubeler Var]' : '';
          row.push(`${found.courseCode} (Ş.${found.sectionNum}) - ${found.instructor}${alt}`);
        } else {
          row.push('');
        }
      });
      matrixData.push(row);
    });

    const wsMatrix = window.XLSX.utils.aoa_to_sheet(matrixData);
    window.XLSX.utils.book_append_sheet(wb, wsMatrix, 'Haftalık Program');

    const detailRows = [
      ['Ders Kodu', 'Ders Adı', 'Bileşen', 'Seçilen Şube', 'Öğretim Üyesi', 'Derslik', 'Gün ve Saatler', 'Aynı Saatteki Alternatifler']
    ];

    sch.selections.forEach(sel => {
      const times = sel.slots.map(s => `${s.day} ${s.start}-${s.end}`).join(', ');
      const rooms = Array.from(new Set(sel.slots.map(s => s.room).filter(Boolean))).join(', ');
      const instrs = Array.from(new Set(sel.slots.map(s => s.instructor).filter(Boolean))).join(', ');
      const alts = sel.allSections && sel.allSections.length > 1
        ? sel.allSections.map(a => `Ş.${a.section} (${a.instructor})`).join(' | ')
        : 'Yok';

      detailRows.push([
        sel.courseCode,
        sel.courseName,
        sel.component === 'lab' ? 'Laboratuvar' : 'Teori',
        sel.section,
        instrs,
        rooms,
        times,
        alts
      ]);
    });

    const wsDetail = window.XLSX.utils.aoa_to_sheet(detailRows);
    window.XLSX.utils.book_append_sheet(wb, wsDetail, 'Ders Detayları');

    window.XLSX.writeFile(wb, `${prefix}.xlsx`);
  } else {
    let csv = '\uFEFFSaat;' + DAYS.join(';') + '\n';
    TIME_SLOTS.forEach((slot, si) => {
      let line = SLOT_LABELS[si];
      DAYS.forEach(day => {
        const found = sch.slots.find(s => {
          const sIdx = getSlotIndex(s.start);
          const span = getSlotSpan(s.start, s.end);
          return s.day === day && si >= sIdx && si < sIdx + span;
        });
        line += ';' + (found ? `"${found.courseCode} Ş.${found.sectionNum} (${found.instructor})"` : '""');
      });
      csv += line + '\n';
    });
    downloadBlob(new Blob([csv], { type: 'text/csv;charset=utf-8;' }), `${prefix}.csv`);
  }
}

function downloadBlob(blob, filename) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
